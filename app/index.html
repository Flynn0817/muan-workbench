// 数据来源：由 server.js 提供 /api/state（本机磁盘真实数据库）时优先用它；
// 若直接双击 html 以 file:// 打开（没起服务），则退回浏览器 localStorage，保证仍可单机使用。
// 注意：部署到 Cloudflare Pages 等静态托管时也是 http(s)，但 /api/health 探测不通 → 自动按离线模式跑（localStorage + 云同步）。
let USE_API=(location.protocol==='http:'||location.protocol==='https:');
async function detectLocalServer(){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),2500);const r=await fetch('/api/health',{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)return false;const ct=(r.headers.get('content-type')||'').toLowerCase();if(ct.indexOf('json')<0)return false;const j=await r.json().catch(()=>null);return !!(j&&j.ok);}catch(e){return false;}}
let state=DEFAULT_STATE();
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x);}
// 深合并：把已存数据覆盖到一份全新的默认状态上，保证所有嵌套字段都存在，
// 避免老版本数据缺失新字段导致渲染抛错（例如 finance.budgets）。
function mergeDeep(base,over){
  if(over===undefined||over===null)return base;
  if(Array.isArray(base))return Array.isArray(over)?over:base;
  if(isObj(base)){
    if(!isObj(over))return over;
    const out={};
    for(const k in base)out[k]=mergeDeep(base[k],over[k]);
    for(const k in over)if(!(k in out))out[k]=over[k];
    return out;
  }
  return over;
}
function migrate(s){
  // 迁移：旧版 achievements 为对象 {id:{at}}，新版的为数组 + achUnlocked
  if(s.achievements&&!Array.isArray(s.achievements)){const old=s.achievements||{};s.achievements=ACH_SEED.slice();s.achUnlocked={};Object.keys(old).forEach(id=>{s.achUnlocked[id]={at:(old[id]&&old[id].at)||now()};});}
  if(!s.achUnlocked)s.achUnlocked={};
  if(!Array.isArray(s.achievements))s.achievements=ACH_SEED.slice();
  return s;
}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.version===2){return migrate(mergeDeep(DEFAULT_STATE(),o));}}}catch(e){}return DEFAULT_STATE();}
async function apiLoad(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)return null;const j=await r.json();if(j&&Object.keys(j).length)return j;return null;}catch(e){return null;}}
async function apiSave(obj){try{await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});}catch(e){}}
async function loadData(){
  if(USE_API){
    const remote=await apiLoad();
    if(remote)return migrate(mergeDeep(DEFAULT_STATE(),remote));
    // 服务端无数据（极少发生，通常是服务未就绪）：直接以空白默认状态启动。
    // 注意：不再回退到浏览器 localStorage 并写回服务端，否则会把旧浏览器缓存里的
    // 经验值/木币/签到覆盖回磁盘数据库，导致「清零」被旧缓存还原。
    return DEFAULT_STATE();
  }
  return loadLocal();
}
function save(){try{if(USE_API){apiSave(state);}else{localStorage.setItem(KEY,JSON.stringify(state));}}catch(e){}cloudMarkDirty();}
/* ============ 云同步（Supabase Auth + REST） ============
 * 数据链路：本机（server.js 磁盘库 或 localStorage）为主 → 云端 muan_state 一行 JSON 作为同步中枢。
 * 并发保护：rev 版本号乐观锁 —— 推送时带 rev 条件写入，版本对不上说明别的设备先写过。
 * 此时绝不静默覆盖：自动推送只跳过并提示；手动「立即同步」才让用户二选一（本机为准 / 云端为准）。
 */
// ⚠️ 开源发布前必须把 DEFAULT_CLOUD 的两个值清成 ''，避免所有用户默认连到你的后端。
// 用户配置存在 state.settings.supabase（会随账号云同步，但每台设备首次登录前需手填一次）。
// RLS 行级安全保证：同一条 muan_state 表里，每个账号只能读写自己的那一行。
const DEFAULT_CLOUD={url:'',key:''};
function cloudCfg(){const s=(state.settings&&state.settings.supabase)||{};return {url:String(s.url||DEFAULT_CLOUD.url||'').replace(/\/+$/,''),key:String(s.key||DEFAULT_CLOUD.key||'')};}
const CLOUD_SESS_KEY='muan.cloudSession';
let cloudSession=null;
let cloudDirty=false;     // 本地有未上云的改动
let cloudBooted=false;    // 启动完成前的自动 save不算"改动"
let cloudPulling=false;   // 正在把云端数据套到本机，期间 save 不触发推送
let cloudLastSync=0;      // 最近一次成功同步的时间戳(ms)
let cloudHint='';         // 需要用户处理的同步提示
let cloudPushTimer=null;
let lastCloudToast=0;
let installPromptEv=null;
function cloudLoadSess(){try{cloudSession=JSON.parse(localStorage.getItem(CLOUD_SESS_KEY)||'null');}catch(e){cloudSession=null;}}
function cloudSaveSess(){try{if(cloudSession)localStorage.setItem(CLOUD_SESS_KEY,JSON.stringify(cloudSession));else localStorage.removeItem(CLOUD_SESS_KEY);}catch(e){}}
function cloudRev(){return +(localStorage.getItem('muan.cloudRev')||0);}
function cloudSetRev(n){try{localStorage.setItem('muan.cloudRev',String(n));}catch(e){}}
function cloudDevice(){try{let id=localStorage.getItem('muan.deviceId');if(!id){id=(/Mobi|Android|iPhone/i.test(navigator.userAgent)?'手机':'电脑')+' '+Math.random().toString(36).slice(2,6);localStorage.setItem('muan.deviceId',id);}return id;}catch(e){return '本机';}}
function cloudAuto(){try{let v=localStorage.getItem('muan.autoSync');if(v===null){v='1';localStorage.setItem('muan.autoSync',v);}return v==='1';}catch(e){return true;}}
function cloudSetAuto(on){try{localStorage.setItem('muan.autoSync',on?'1':'0');}catch(e){}state.settings.sync=on;}
function cloudMarkDirty(){if(!cloudBooted||cloudPulling)return;cloudDirty=true;if(cloudAuto()&&cloudSession)cloudSchedulePush();}
function cloudSchedulePush(){if(cloudPushTimer)clearTimeout(cloudPushTimer);cloudPushTimer=setTimeout(()=>{cloudPushTimer=null;cloudPush(false,true).then(r=>{if(r&&r.err)cloudToastThrottled('云同步失败：'+r.err);});},3000);}
function cloudToastThrottled(msg){const t=Date.now();if(t-lastCloudToast<30000)return;lastCloudToast=t;toast(msg,'warn');}
function cloudRefreshSettings(){if(current==='settings'||current==='me')renderView();}
async function cloudAuth(path,body){
  let r;try{r=await fetch(cloudCfg().url+'/auth/v1/'+path,{method:'POST',headers:{'apikey':cloudCfg().key,'Content-Type':'application/json'},body:JSON.stringify(body)});}catch(e){return {error:'网络不通，稍后再试'};}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)return {error:j.msg||j.error_description||j.error||('HTTP '+r.status)};
  if(!j.access_token)return {needConfirm:true};
  cloudSession={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:(j.user&&j.user.id)||'',email:(j.user&&j.user.email)||''};
  cloudSaveSess();return {ok:true};
}
async function cloudRefresh(){
  if(!cloudSession||!cloudSession.refresh_token)return false;
  try{
    const r=await fetch(cloudCfg().url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':cloudCfg().key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token){if(r.status===400||r.status===401||r.status===403){cloudSession=null;cloudSaveSess();}return false;}
    cloudSession.access_token=j.access_token;cloudSession.refresh_token=j.refresh_token;cloudSession.expires_at=Math.floor(Date.now()/1000)+(j.expires_in||3600);cloudSaveSess();return true;
  }catch(e){return false;}
}
async function cloudApi(path,opts){
  opts=opts||{};
  if(cloudSession&&cloudSession.expires_at&&cloudSession.expires_at*1000<Date.now()+60000){const ok=await cloudRefresh();if(!ok)return {status:401,err:'登录已过期，请重新登录'};}
  const h=Object.assign({'apikey':cloudCfg().key,'Content-Type':'application/json'},opts.headers||{});
  if(cloudSession)h['Authorization']='Bearer '+cloudSession.access_token;
  let r;try{r=await fetch(cloudCfg().url+path,Object.assign({},opts,{headers:h}));}catch(e){return {status:0,err:'网络不通'};}
  if(r.status===401){const ok=await cloudRefresh();if(ok)return cloudApi(path,opts);cloudSession=null;cloudSaveSess();return {status:401,err:'登录已过期，请重新登录'};}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(r.status>=400)return {status:r.status,err:(j&&(j.message||j.error_description||j.msg))||('HTTP '+r.status)};
  return {status:r.status,j};
}
async function cloudPush(force,auto){
  if(!cloudSession||!cloudSession.uid)return {err:'未登录'};
  if(cloudAuto())state.settings.sync=true;
  if(cloudPulling)return {skip:true};
  // —— 安全闸：非强推时先比对云端内容，不一致绝不明写覆盖 ——
  if(!force){
    const chk=await cloudApi('/rest/v1/muan_state?select=data,rev&user_id=eq.'+cloudSession.uid+'&limit=1',{});
    if(chk.status===401||chk.status===0)return {err:chk.err};
    if(chk.status<400&&chk.j&&chk.j[0]){
      const same=JSON.stringify(chk.j[0].data)===JSON.stringify(state);
      if(!same){
        if(auto){ // 全自动模式：模块级合并，两边都不丢
          const merged=cloudAutoMerge(chk.j[0].data);
          if(merged){
            cloudApply(merged);cloudSetRev(chk.j[0].rev);
            cloudSeenSave(merged);cloudDirty=false;cloudHint='';cloudLastSync=Date.now();
            renderAll();cloudRefreshSettings();
            toast('已自动合并电脑/手机的改动（同处都改过则以本机为准，可在🕘云端备份回退）','gold');
            return {ok:true,merged:true};
          }
        }
        cloudHint='云端数据与本机不一致（可能来自另一台设备）。点「立即同步」选择以哪边为准，避免互相覆盖';
        cloudDirty=true;cloudRefreshSettings();
        return {conflict:true,remoteRev:chk.j[0].rev};
      }
      if(chk.j[0].rev!==cloudRev())cloudSetRev(chk.j[0].rev);
    }
  }
  const rev=cloudRev();
  const r=await cloudApi('/rest/v1/muan_state?user_id=eq.'+cloudSession.uid+'&rev=eq.'+rev,{method:'PATCH',body:JSON.stringify({data:state,rev:rev+1,device:cloudDevice()}),headers:{'Prefer':'return=representation'}});
  if(r.status>=400||r.status===0)return {err:r.err||('HTTP '+r.status)};
  if(r.j&&r.j.length){cloudSetRev(rev+1);cloudDirty=false;cloudHint='';cloudLastSync=Date.now();cloudSeenSave(state);cloudRefreshSettings();return {ok:true};}
  // 影响 0 行：云端还没有这一行 → 首次上传；或版本已被别的设备推进 → 冲突
  const g=await cloudApi('/rest/v1/muan_state?select=rev&user_id=eq.'+cloudSession.uid,{});
  if(g.status>=400)return {err:g.err};
  if(!g.j||!g.j.length){
    const ins=await cloudApi('/rest/v1/muan_state?on_conflict=user_id',{method:'POST',body:JSON.stringify({user_id:cloudSession.uid,data:state,rev:rev+1,device:cloudDevice()}),headers:{'Prefer':'resolution=merge-duplicates,return=minimal'}});
    if(ins.status>=400)return {err:ins.err};
    cloudSetRev(rev+1);cloudDirty=false;cloudHint='';cloudLastSync=Date.now();cloudSeenSave(state);cloudRefreshSettings();return {ok:true};
  }
  const remoteRev=g.j[0].rev||0;
  if(force){
    const f=await cloudApi('/rest/v1/muan_state?user_id=eq.'+cloudSession.uid+'&rev=eq.'+remoteRev,{method:'PATCH',body:JSON.stringify({data:state,rev:remoteRev+1,device:cloudDevice()}),headers:{'Prefer':'return=representation'}});
    if(f.status>=400)return {err:f.err};
    cloudSetRev(remoteRev+1);cloudDirty=false;cloudHint='';cloudLastSync=Date.now();cloudSeenSave(state);cloudRefreshSettings();return {ok:true};
  }
  cloudHint='云端有其他设备的更新（版本 '+remoteRev+'），去设置点「立即同步」处理';
  cloudRefreshSettings();
  return {conflict:true,remoteRev:remoteRev};
}
async function cloudPull(){
  if(!cloudSession||!cloudSession.uid)return {err:'未登录'};
  const r=await cloudApi('/rest/v1/muan_state?select=data,rev,updated_at,device&user_id=eq.'+cloudSession.uid+'&limit=1',{});
  if(r.status>=400)return {err:r.err};
  const row=r.j&&r.j[0];
  cloudLastSync=Date.now();
  if(!row)return {ok:true,empty:true};
  const remoteRev=row.rev||0;
  if(remoteRev===cloudRev())return {ok:true,same:true};
  if(cloudDirty){
    if(cloudAuto()){
      const merged=cloudAutoMerge(row.data);
      if(merged){
        cloudPulling=true;
        try{cloudApply(merged);cloudSetRev(remoteRev);cloudSeenSave(merged);cloudDirty=false;cloudHint='';cloudLastSync=Date.now();renderAll();}finally{cloudPulling=false;}
        cloudRefreshSettings();toast('已自动合并两端改动','gold');
        return {ok:true,merged:true};
      }
    }
    cloudHint='云端有其他设备的更新（版本 '+remoteRev+'），去设置点「立即同步」处理';cloudRefreshSettings();return {conflict:true,remoteRev:remoteRev};
  }
  // 本机从未同步过(版本0)但已有真实数据，而云端也有不同数据 → 不静默吞掉本机，让用户选择
  if(cloudRev()===0&&remoteRev>0&&cloudLocalFilled()){cloudHint='本机已有数据、云端也有数据：点「立即同步」选择以哪边为准';cloudDirty=true;cloudRefreshSettings();return {conflict:true,remoteRev:remoteRev};}
  cloudPulling=true;
  try{
    state=migrate(mergeDeep(DEFAULT_STATE(),row.data));
    cloudSetRev(remoteRev);cloudDirty=false;cloudHint='';cloudLastSync=Date.now();cloudSeenSave(row.data);
    try{if(USE_API)apiSave(state);else localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
    renderAll();
  }finally{cloudPulling=false;}
  cloudRefreshSettings();
  return {ok:true};
}
async function syncNow(){
  if(!cloudSession){toast('请先在下方登录云同步账号','warn');return;}
  toast('正在同步…');
  if(cloudDirty){
    const g=await cloudApi('/rest/v1/muan_state?select=rev&user_id=eq.'+cloudSession.uid,{});
    const remoteRev=(g.j&&g.j[0]&&g.j[0].rev)||0;
    if(remoteRev>cloudRev()){
      const useLocal=confirm('云端已有其他设备的更新（云端版本 '+remoteRev+'，本机记录版本 '+cloudRev()+'）。\n\n点「确定」= 用本机覆盖云端（云端那些改动会被本机版本替换）\n点「取消」= 保留云端，本机未同步的改动将被丢弃');
      const r=useLocal?await cloudPush(true):await cloudPull();
      if(r&&r.err)toast('同步失败：'+r.err,'warn');else toast(useLocal?'已用本机覆盖云端':'已采用云端数据','gold');
      return;
    }
    const r=await cloudPush();
    if(r&&r.err)toast('同步失败：'+r.err,'warn');
    else if(r&&r.conflict){
      const useLocal=confirm('云端与本机数据不一致。\n\n点「确定」= 用本机覆盖云端\n点「取消」= 保留云端并丢弃本机未同步改动');
      if(useLocal){const p=await cloudPush(true);if(p&&p.err)toast('同步失败：'+p.err,'warn');else toast('已用本机覆盖云端','gold');}
      else{cloudDirty=false;const p=await cloudPull();if(p&&p.err)toast('同步失败：'+p.err,'warn');else toast('已采用云端数据','gold');}
    }
    else if(r&&r.ok)toast(r.merged?'已自动合并两端改动':'已同步到云端','gold');
    return;
  }
  const r=await cloudPull();
  if(r&&r.err)toast('同步失败：'+r.err,'warn');
  else if(r&&r.conflict){
    const useLocal=confirm('云端与本机都有改动。\n\n点「确定」= 用本机覆盖云端\n点「取消」= 保留云端（本机未同步的改动将被丢弃）');
    if(useLocal){const p=await cloudPush(true);if(p&&p.err)toast('同步失败：'+p.err,'warn');else toast('已用本机覆盖云端','gold');}
    else{cloudDirty=false;const p=await cloudPull();if(p&&p.err)toast('同步失败：'+p.err,'warn');else toast('已采用云端数据','gold');}
  }
  else if(r&&r.same){
    // 版本号相同但内容可能不同（历史事故残留）→ 比对一次内容再决定
    const cmp=await cloudApi('/rest/v1/muan_state?select=data&user_id=eq.'+cloudSession.uid+'&limit=1',{});
    const differs=cmp.status<400&&cmp.j&&cmp.j[0]&&JSON.stringify(cmp.j[0].data)!==JSON.stringify(state);
    if(differs){
      const useLocal=confirm('本机与云端“版本号相同但内容不一致”（通常是历史同步事故残留）。\n\n点「确定」= 以本机为准上传（本机数据更全时选这个）\n点「取消」= 以云端为准覆盖本机');
      if(useLocal){const p=await cloudPush(true);if(p&&p.err)toast('同步失败：'+p.err,'warn');else toast('已用本机覆盖云端','gold');}
      else{const rm=cmp.j[0].data;cloudApply(migrate(mergeDeep(DEFAULT_STATE(),rm)));cloudDirty=false;cloudSeenSave(rm);toast('已采用云端数据','gold');}
      return;
    }
    toast('已是最新，无需同步','gold');
  }
  else if(r&&r.empty){const p=await cloudPush(true);if(p&&p.err)toast('同步失败：'+p.err,'warn');else toast('已把本机数据上传为云端初始版本','gold');}
}
async function cloudSigninUI(){
  const em=($('#cl_email')||{}).value||'', pw=($('#cl_pass')||{}).value||'';
  if(!em||!pw){toast('先填邮箱和密码','warn');return;}
  toast('正在登录…');
  const r=await cloudAuth('token?grant_type=password',{email:em,password:pw});
  if(r.error){toast('登录失败：'+r.error,'warn');return;}
  if(r.needConfirm){toast('请先去邮箱点确认链接，再回来登录','warn');return;}
  try{localStorage.setItem('muan.cloudEmail',em);}catch(e){}
  cloudSetAuto(true);
  cloudDirty=false;const p=await cloudPull();
  save();
  renderView();
  if(p&&p.err)toast('已登录，但拉取云端失败：'+p.err,'warn');
  else if(p&&p.ok&&!p.same&&!p.empty)toast('登录成功，已恢复云端数据','gold');
  else toast('登录成功','gold');
}
async function cloudSignupUI(){
  const em=($('#cl_email')||{}).value||'', pw=($('#cl_pass')||{}).value||'';
  if(!em||pw.length<6){toast('邮箱必填，密码至少 6 位','warn');return;}
  toast('正在注册…');
  const r=await cloudAuth('signup',{email:em,password:pw});
  if(r.error){toast('注册失败：'+r.error,'warn');return;}
  try{localStorage.setItem('muan.cloudEmail',em);}catch(e){}
  if(r.needConfirm){toast('注册成功！请打开邮箱点确认链接，然后回来点「登录」','gold');renderView();return;}
  cloudSetAuto(true);cloudDirty=true;await cloudPush();renderView();
  toast('注册成功，本机数据已上传云端','gold');
}
function cloudLocalFilled(){const s=state||{};return ((s.todos&&s.todos.length)||(s.reviews&&s.reviews.daily&&s.reviews.daily.length)||(s.finance&&s.finance.transactions&&s.finance.transactions.length)||(s.studyPlans&&s.studyPlans.length)||(s.timeBlocks&&s.timeBlocks.length)||(s.research&&s.research.papers&&s.research.papers.length)||(s.log&&s.log.length)||(s.profile&&s.profile.xp>0))?true:false;}
/* —— 全自动同步：模块级合并 —— */
let cloudSeen=null;
function cloudSeenLoad(){try{const r=localStorage.getItem('muan.seen');cloudSeen=r?JSON.parse(r):null;}catch(e){cloudSeen=null;}}
function cloudSeenSave(obj){try{cloudSeen=obj?JSON.parse(JSON.stringify(obj)):null;localStorage.setItem('muan.seen',cloudSeen?JSON.stringify(cloudSeen):'');}catch(e){}}
function cloudDeepEq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
/* 以"上次看到过的云端快照"为基准，把本机与云端按顶层模块合并：
   模块只有本机改过→用本机；只有云端改过→用云端；两边都改/都没改→本机优先（云端有版本留档可回退）。
   返回合并后的 state；若自动同步关闭则返回 null（保持人工选择）。 */
function cloudAutoMerge(remote){
  if(!cloudAuto())return null;
  try{
    const base=cloudSeen||{};
    const DEF=DEFAULT_STATE();
    const out=JSON.parse(JSON.stringify(remote));
    for(const k in state){
      const localVal=state[k];
      if(!(k in out)){out[k]=JSON.parse(JSON.stringify(localVal));continue;}
      const isDefault=cloudDeepEq(localVal,DEF[k]);
      const localTouched=!isDefault&&!cloudDeepEq(localVal,base[k]===undefined?null:base[k]);
      if(localTouched)out[k]=JSON.parse(JSON.stringify(localVal));
    }
    return migrate(mergeDeep(DEFAULT_STATE(),out));
  }catch(e){return null;}
}
function cloudApply(obj){
  state=obj;

}
async function cloudRestoreRev(rev){
  if(!cloudSession){toast('请先登录','warn');return;}
  toast('正在取回云端版本 '+rev+' …');
  const r=await cloudApi('/rest/v1/muan_state_hist?select=data,rev,ts&user_id=eq.'+cloudSession.uid+'&rev=eq.'+rev+'&limit=1',{});
  if(r.status>=400||!r.j||!r.j[0]){toast('取回失败：'+(r.err||'没有该版本'),'warn');return;}
  cloudPulling=true;
  try{
    state=migrate(mergeDeep(DEFAULT_STATE(),r.j[0].data));
    try{if(USE_API)apiSave(state);else localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
    renderAll();closeModal();
  }finally{cloudPulling=false;}
  toast('已把版本 '+rev+' 取回本机。核对无误后，点「立即同步」并选择「用本机覆盖云端」写回云端','gold');
}

// 建表 SQL（与 supabase-setup.sql 同步维护）：开源用户在 Supabase SQL Editor 里执行一次
const SETUP_SQL=`-- 木案工作台 · 云同步建表脚本（只需执行一次）
-- 用法：Supabase 控制台 → 左侧 SQL Editor → New query → 粘贴全部 → Run
create table if not exists public.muan_state (
  id         uuid primary key default gen_random_uuid(),
  user_id    uuid not null unique references auth.users(id) on delete cascade,
  data       jsonb not null default '{}'::jsonb,
  rev        bigint not null default 1,
  device     text not null default '',
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
alter table public.muan_state enable row level security;

drop policy if exists "muan_select_own" on public.muan_state;
drop policy if exists "muan_insert_own" on public.muan_state;
drop policy if exists "muan_update_own" on public.muan_state;
drop policy if exists "muan_delete_own" on public.muan_state;
create policy "muan_select_own" on public.muan_state
  for select using (auth.uid() = user_id);
create policy "muan_insert_own" on public.muan_state
  for insert with check (auth.uid() = user_id);
create policy "muan_update_own" on public.muan_state
  for update using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "muan_delete_own" on public.muan_state
  for delete using (auth.uid() = user_id);

create or replace function public.muan_touch_updated_at()
returns trigger language plpgsql as $$
begin
  new.updated_at = now();
  return new;
end $$;

drop trigger if exists trg_muan_touch on public.muan_state;
create trigger trg_muan_touch
  before update on public.muan_state
  for each row execute function public.muan_touch_updated_at();`;
// 自检配置：能否连上后端、表建了没有
async function cloudTestCfg(){
  const {url,key}=cloudCfg();
  if(!url||!key)return 'RESULT|warn|请先填写并保存 Project URL 和 Publishable Key';
  let r;try{r=await fetch(url+'/auth/v1/health',{headers:{'apikey':key}});}catch(e){return 'RESULT|warn|连不上 '+url+'：地址写错或网络不通';}
  if(!r.ok)return 'RESULT|warn|服务可达但 Key 验证失败（HTTP '+r.status+'）：检查 Key 是否复制完整';
  let t;try{t=await fetch(url+'/rest/v1/muan_state?select=rev&limit=1',{headers:{'apikey':key}});}catch(e){return 'RESULT|warn|网络中断，请重试';}
  if(t.status===200)return 'RESULT|gold|✓ 连接正常，数据表已就绪，可以注册/登录了';
  try{const j=await t.json();if(j&&j.code==='PGRST205')return 'RESULT|warn|连接正常，但还没建表：点「复制建表 SQL」去 Supabase 执行后，再测一次';}catch(e){}
  return 'RESULT|warn|连接正常，但数据表异常（HTTP '+t.status+'）';
}

/* ============ 期刊雷达：OpenAlex / Crossref 搜索 ============
 * 无需 API Key，完全免费。
 * 在线模式：通过 server.js 代理请求（规避 CORS）
 * 离线模式：使用 localStorage 缓存的上次结果
 */
async function fetchJournalArticles(){
  const J=state.research.journals;
  const followed=J.followed||[];
  const mode=USE_API?'在线(服务端代理)':'离线(浏览器直连)';
  J.mode=mode;
  const F0=J.filters||{recent:'all'};
  /* 近期(近1/3/5年)改为纯前端过滤（renderJournalArticles 的 minY），不再下发给抓取接口；
     否则会导致 J.articles 被收窄成子集，"重置"无法恢复全部文章。抓取始终取各刊最新若干篇。 */
  const years=0;
  if(!followed.length){toast('请先在「期刊库」关注期刊','warn');return;}
  toast('正在抓取期刊文章… ['+mode+']');
  try{
    if(USE_API){
      const items=followed.map(f=>f.issn+'~~'+f.name).join('|');
      const r=await fetch('/api/journals?action=latest&items='+encodeURIComponent(items)+'&years='+years,{cache:'no-store'});
      let data={};
      if(r.ok){ try{ data=await r.json(); }catch(e){ data={}; } }
      if(data.articles&&data.articles.length){
        J.articles=data.articles.concat(J.articles||[]).slice(0,200);
        J.lastFetch=new Date().toISOString();
        J.lastError=data.cached?('实时抓取失败，显示缓存的 '+data.articles.length+' 篇（网络可能临时不可用）'):'';
        save();renderView();
        toast(data.cached?('显示缓存的 '+data.articles.length+' 篇（实时抓取失败）'):('已更新 '+data.articles.length+' 篇文章 📡'), data.cached?'warn':'gold');
        return;
      }
      J.lastError=data.error||'服务端返回空（server.js 可能未能访问 OpenAlex / Crossref，或网络超时）';
      save();renderView();
      toast('未获取到文章 ['+mode+']：'+(data.error||'检查 server.js 是否在运行、本机能否访问外网学术 API'),'warn');
      return;
    }
    /* 离线模式（file:// 双击打开）：优先尝试本地 server.js 代理，失败再浏览器直连 OpenAlex */
    let viaProxy=false;
    try{
      const items=followed.map(f=>f.issn+'~~'+f.name).join('|');
      const pr=await fetch('http://localhost:8765/api/journals?action=latest&items='+encodeURIComponent(items)+'&years='+years,{cache:'no-store'});
      if(pr.ok){
        const pd=await pr.json();
        if(pd.articles&&pd.articles.length){
          J.articles=pd.articles.concat(J.articles||[]).slice(0,200);
          J.lastFetch=new Date().toISOString();J.lastError='';J.mode='离线(本地代理 localhost:8765)';
          save();renderView();toast('已更新 '+pd.articles.length+' 篇文章（本地代理）','gold');
          return;
        }
      }
    }catch(e){/* 本地代理不可用，继续走浏览器直连 */ viaProxy=false;}
    /* 浏览器直连 OpenAlex（支持 CORS）：ISSN 优先 → 刊名兜底（中文刊）→ Crossref 兜底 */
    const all=[];
    for(const f of followed.slice(0,10)){
      try{
        let res=await oaClientByIssn(f.issn, years);          // 国际刊：ISSN 直接命中
        if(!res.length && f.name) res=await oaClientByName(f.name, years); // 中文刊：刊名→source id→works
        if(!res.length && f.issn) res=await crClientByIssn(f.issn); // 备用：Crossref（国内通常更稳定）
        res.forEach(a=>{a.issn=f.issn||a.issn;all.push(a);});
      }catch(e){}
    }
    if(all.length){J.articles=all.concat(J.articles||[]).slice(0,200);J.lastFetch=new Date().toISOString();J.lastError='';save();renderView();toast('已更新 '+all.length+' 篇（浏览器直连）','gold');}
    else{J.lastError='本机直连 OpenAlex 与 Crossref 均无返回（本机需能访问 api.openalex.org / api.crossref.org，或网络被拦）';save();renderView();toast('未获取到文章 ['+mode+']：①先试「在线模式」——运行 node server.js 后访问 http://localhost:8765 ；②确认本机能访问外网学术 API','warn');}
  }catch(e){J.lastError='抓取异常：'+e.message;save();renderView();toast('抓取失败 ['+mode+']：'+e.message,'warn');}
}
async function fetchJournalSearch(q){
  toast('搜索中…');
  try{
    let results=[];
    if(USE_API){
      const r=await fetch('/api/journals?action=search&q='+encodeURIComponent(q),{cache:'no-store'});
      if(r.ok){const d=await r.json();results=d.results||[];}
    }else{
      /* OpenAlex 直接搜 */
      const url='https://api.openalex.org/works?search='+encodeURIComponent(q)+'&sort=citation_count:desc&per_page=10';
      const xr=await fetch(url);
      if(xr.ok){const d=await xr.json();(d.results||[]).forEach(a=>{results.push({id:a.id,title:a.title,authors:(a.authorships||[]).map(x=>x.author?.display_name).filter(Boolean).join(', '),journal:a.primary_location?.source?.display_name||'',year:a.publication_year,cited:a.cited_by_count,url:a.doi?'https://doi.org/'+a.doi:'',abstract:(a.abstract_inverted_index?reconstructAbstract(a.abstract_inverted_index):'').slice(0,300)});});}
    }
    state.research.journals.recs=results;
    save();renderView();
    journalTab='search';renderView();
    toast(results.length?'找到 '+results.length+' 条结果':'无结果，换个关键词试试','gold');
  }catch(e){toast('搜索失败：'+e.message,'warn');}
}
/* OpenAlex abstract 是 inverted index，需还原 */
function reconstructAbstract(idx){if(!idx)return '';const pairs=Object.entries(idx).map(([k,v])=>[+k,v]);pairs.sort((a,b)=>a[0]-b[0]);return pairs.map(p=>p[1]).join(' ');}
/* 离线模式（未运行 server.js）浏览器直连 OpenAlex：与 server.js 同逻辑的两级解析 */
function oaClientMap(a){
  let ab='';if(a.abstract_inverted_index){const ps=Object.entries(a.abstract_inverted_index).map(([k,v])=>[+k,v]).sort((x,y)=>x[0]-y[0]);ab=ps.map(p=>p[1]).join(' ').slice(0,400);}
  const loc=a.primary_location&&a.primary_location.source;
  const oaLoc=a.best_oa_location||{};
  const oaUrl=oaLoc.pdf_url||oaLoc.landing_page_url||(a.open_access&&a.open_access.oa_url)||'';
  const oaStatus=(a.open_access&&a.open_access.oa_status)||(oaUrl?'green':'closed');
  return {id:a.id,title:a.title,authors:(a.authorships||[]).map(x=>x.author&&x.author.display_name).filter(Boolean).join(', '),journal:(loc&&loc.display_name)||'',issn:'',year:a.publication_year,abstract:ab,url:a.doi?('https://doi.org/'+a.doi):'',oaUrl:oaUrl,oaStatus:oaStatus,fetchedAt:new Date().toISOString()};
}
function oaClientFromSuffix(years){ if(!years||years<=0) return ''; const y=new Date().getFullYear()-Math.floor(years); return ',from_publication_date:'+y+'-01-01'; }
async function oaClientByIssn(issn, years){
  try{
    const f='primary_location.source.issn:'+encodeURIComponent(issn)+oaClientFromSuffix(years);
    const r=await fetch('https://api.openalex.org/works?filter='+f+'&sort=publication_date:desc&per_page=5');
    if(!r.ok)return [];const d=await r.json();return (d.results||[]).map(oaClientMap);
  }catch(e){return [];}
}
async function oaClientByName(name, years){
  try{
    const s=await fetch('https://api.openalex.org/sources?search='+encodeURIComponent(name)+'&per_page=1');
    if(!s.ok)return [];const sj=await s.json();const src=(sj.results||[])[0];if(!src||!src.id)return [];
    const f='primary_location.source.id:'+encodeURIComponent(src.id)+oaClientFromSuffix(years);
    const r=await fetch('https://api.openalex.org/works?filter='+f+'&sort=publication_date:desc&per_page=5');
    if(!r.ok)return [];const d=await r.json();return (d.results||[]).map(oaClientMap);
  }catch(e){return [];}
}
async function crClientByIssn(issn){
  try{
    const r=await fetch('https://api.crossref.org/journals/'+encodeURIComponent(issn)+'/works?sort=published&order=desc&rows=5');
    if(!r.ok)return [];const d=await r.json();const items=(d.message&&d.message.items)||[];
    return items.map(it=>{
      const title=Array.isArray(it.title)?it.title[0]:(it.title||'');
      const authors=(it.author||[]).map(x=>((x.given||'')+' '+(x.family||'')).trim()||(x.name||'')).filter(Boolean).join(', ');
      const container=(it['container-title']&&it['container-title'][0])||'';
      const dp=(it['published-print']||it['published-online']||it.created||{});
      const parts=(dp&&dp['date-parts']&&dp['date-parts'][0])||null;
      const year=parts?parts[0]:null;
      const abstract=(it.abstract||'').replace(/<[^>]+>/g,' ');
      const url=it.URL||(it.DOI?('https://doi.org/'+it.DOI):'');
      return {id:it.DOI?('https://doi.org/'+it.DOI):(it.URL||''),title,authors,journal:container,issn:'',year,abstract:abstract.slice(0,400),url,via:'crossref',oaUrl:'',oaStatus:'closed',fetchedAt:new Date().toISOString()};
    });
  }catch(e){return [];}
}

/* ============ gamification ============ */
const xpNeed=lv=>100+(lv-1)*50;
function addCoins(n,reason){state.profile.coins+=n;state.log.push({t:now(),k:'coin',n,reason});save();}
function addXP(n){state.profile.xp+=n;while(state.profile.xp>=xpNeed(state.profile.level)){state.profile.xp-=xpNeed(state.profile.level);state.profile.level++;addCoins(50,'升级奖励');toast('升级！Lv.'+state.profile.level+' 🎉','gold');renderTop();}save();}
function removeXP(n){if(n>0){state.profile.xp=Math.max(0,state.profile.xp-n);renderTop();save();}}
function doCheckin(){
  const t=todayStr();
  if(state.profile.lastCheckin===t){toast('今天已经签到啦');return;}
  const y=addDays(t,-1);
  if(state.profile.lastCheckin===y){state.profile.streak++;}
  else{state.profile.streak=1;}
  state.profile.lastCheckin=t;
  state.profile.longestStreak=Math.max(state.profile.longestStreak,state.profile.streak);
  const bonus=Math.min(state.profile.streak,10);
  addCoins(5+bonus,'连续打卡');
  addXP(5);
  markActive();
  checkAch();save();renderTop();renderView();
  speak(state.profile.streak>=3?DIALOGS.checkinStreak(state.profile.streak):DIALOGS.checkinFirst);
}
const ACH_ICONS=['time','flame','sport','course','study','research','finance','news','review','trophy','seedling','coin','check','bell','gift','overview'];
function checkAch(){
  let got=0;
  state.achievements.forEach(a=>{
    if(a.auto&&ACH_TESTS[a.id]&&!state.achUnlocked[a.id]){
      if(ACH_TESTS[a.id]()){state.achUnlocked[a.id]={at:now()};addCoins(30,'成就：'+a.name);got++;speak(DIALOGS.achUnlock(a.name));}
    }
  });
  if(got){renderView();}
  return got;
}

function openAch(a){
  const sel=(arr,cur)=>arr.map(o=>`<option value="${o[1]}" ${cur===o[1]?'selected':''}>${o[0]}</option>`).join('');
  const icopt=ACH_ICONS.map(i=>`<option value="${i}" ${a&&a.ico===i?'selected':''}>${i}</option>`).join('');
  const happy=a?a.happy||3:3;
  const reward=a?a.reward||(50+(happy-1)*25):(50+(happy-1)*25);
  openModal(a?'编辑成就':'新建成就（纪念成就）',`<label class="fld">名称</label><input id="m_name" value="${a?esc(a.name):''}" placeholder="如：雅思首考达标"/>
  <label class="fld">达成日期</label><input id="m_date" type="date" value="${a?esc(a.date||''):todayStr()}"/>

/* ===== 周抽奖池 · 抽奖券经济规则 =====
 * 获得 ① 周目标：完成三档健康行为各解锁 1 张（专注学习块满 5 / 运动满 2 / 日复盘满 4 天，每档每周仅 1 张）
 *      ② 购券：150 木币/张（每周≤1、每月≤2），供只差一张时应急
 * 护栏：每自然月「到账」合计（行为+购券）≤10 张，控制木币供给、避免通胀；
 *      未用券每周日 24:00 作废（跨周检测时清零），鼓励当周用掉、不囤积。
 */
const REWARD_MONTH_CAP=10, REWARD_BUY_COST=150, REWARD_BUY_WK=1, REWARD_BUY_MO=2;
function rewardPoolEnsure(){
  const p=state.rewardPool; const w=weekKey(); const mk=todayStr().slice(0,7);
  if(p.lastWeek!==w){ p.tickets=0;p.lastWeek=w;p.weekGot={};p.boughtWk=0; }   // 跨周：未用券作废、周目标与周购券计数重置
  if(p.monthKey!==mk){ p.monthKey=mk;p.monthGot=0;p.boughtMo=0; }            // 跨月：月到账与月购券计数重置
  return p;
}
function rewardWkProgress(){
  const w=weekKey();
  const focus=state.timeBlocks.filter(b=>b.date>=w&&b.cat==='学习'&&b.done).length;
  const workout=state.workouts.filter(x=>x.date>=w).length;
  const review=state.reviews.daily.filter(r=>r.date>=w).length;
  return {focus:Math.min(5,focus),focusRaw:focus,workout:Math.min(2,workout),workoutRaw:workout,review:Math.min(4,review),reviewRaw:review};
}
function rewardAutoGrant(){
  const p=rewardPoolEnsure(); const pr=rewardWkProgress(); let gave=0;
  const pay=(k,ok)=>{ if(!p.weekGot[k]&&ok){ p.weekGot[k]=1; if(p.monthGot<REWARD_MONTH_CAP){ p.tickets=(p.tickets||0)+1;p.monthGot++;gave++; } } };
  pay('focus',pr.focus>=5); pay('workout',pr.workout>=2); pay('review',pr.review>=4);
  if(gave)save();
  return gave;
}
function rewardDraw(){
  rewardAutoGrant();
  const p=state.rewardPool;
  if((p.tickets||0)<=0){toast('本周还没有抽奖券：完成「专注×5 / 运动×2 / 复盘×4 天」任一一档可得 1 张，或花 150 木币购券','warn');return;}
  p.tickets--;
  const amt=20+Math.floor(Math.random()*181); // 随机 20–200 木币
  addCoins(amt,'抽奖');
  p.history.unshift({t:now(),coin:amt});if(p.history.length>8)p.history.pop();
  save();renderView();renderTop();toast('抽中 '+amt+' 木币 🪙','gold');speak('抽中 '+amt+' 木币！');
}
function rewardBuyTicket(){
  rewardAutoGrant();
  const p=state.rewardPool; const mk=todayStr().slice(0,7);
  if(p.monthGot>=REWARD_MONTH_CAP){toast('本月到账券已达上限（10/10），下月再来','warn');return;}
  if((p.boughtMo||0)>=REWARD_BUY_MO){toast('本月购券已达上限（'+REWARD_BUY_MO+'/'+REWARD_BUY_MO+'）','warn');return;}
  if((p.boughtWk||0)>=REWARD_BUY_WK){toast('本周已购 1 张，下周再买','warn');return;}
  if(state.profile.coins<REWARD_BUY_COST){toast('木币不足，还差 '+(REWARD_BUY_COST-state.profile.coins)+' 🪙','warn');return;}
  state.profile.coins-=REWARD_BUY_COST;p.tickets=(p.tickets||0)+1;p.monthGot++;p.boughtWk++;p.boughtMo++;
  save();renderTop();renderView();toast('已用 150 木币购得 1 张抽奖券 🎫','gold');
}

function todoRelDate(label){
  const today=new Date(); today.setHours(0,0,0,0);
  if(/今天/.test(label)) return ymd(today);
  if(/明天/.test(label)) return addDays(today,1);
  if(/后天/.test(label)) return addDays(today,2);
  if(/大后天/.test(label)) return addDays(today,3);
  // 字符→星期索引(周一=0…周日=6)
  const charToIdx=c=>{const wd=['一','二','三','四','五','六','日','天'];return wd.indexOf(c==='天'?'日':c);};
  const wdToday=(today.getDay()+6)%7; // 周一=0…周日=6
  // 下周X / 下下周X：取“下一个周一”起算的该星期几
  let m=label.match(/下+(周)?([一二三四五六日天])/);
  if(m){ const ti=charToIdx(m[2]); let toNextMon=(7-wdToday)%7; if(toNextMon===0)toNextMon=7; const extra=(label.match(/下/g)||[]).length-1; return addDays(today, toNextMon+ti+7*Math.max(0,extra-1)); }
  m=label.match(/(?:本|这)?周([一二三四五六日天])/);
  if(m){ const ti=charToIdx(m[1]); let diff=ti-wdToday; if(diff<0)diff+=7; return addDays(today,diff); }
  m=label.match(/周([一二三四五六日天])/);
  if(m){ const ti=charToIdx(m[1]); let diff=ti-wdToday; if(diff<0)diff+=7; return addDays(today,diff); }
  return null;
}
function todoGuessCat(s){
  const s2=s.toLowerCase();
  if(/论文|文献|实验|综述|开题|调研|数据|课题|投稿|研究|期刊|综述|摘要/.test(s2)) return '科研';
  if(/作业|复习|预习|考试|课程|读书|背单词|英语|学习|上课|笔记/.test(s2)) return '学习';
  if(/跑步|健身|运动|锻炼|打球|瑜伽|游泳|骑行|徒步/.test(s2)) return '运动';
  if(/购物|缴费|洗衣|打扫|整理|银行|快递|做饭|买菜|挂号|体检/.test(s2)) return '生活';
  if(/会议|汇报|邮件|面试|提交|方案|ppt|周报|对接/.test(s2)) return '工作';
  return '其他';
}
function parseTodoLine(line){
  let s=line.trim(); if(!s) return null;
  let due='', dueTime='';
  // 1) 时间：HH:MM / X点(半|X分)，含上午/下午/晚上/中午/凌晨
  const tm=s.match(/(\d{1,2})[:：](\d{2})/);
  if(tm){ dueTime=String(+tm[1]).padStart(2,'0')+':'+tm[2]; s=s.replace(tm[0],' '); }
  else{
    const tm2=s.match(/(上午|下午|晚上|早上|中午|凌晨)?(\d{1,2})点(半|(\d{1,2})分)?/);
    if(tm2){ let h=+tm2[2]; const ap=tm2[1]||''; const half=tm2[3]==='半'; let mm=half?30:(tm2[4]?+tm2[4]:0);
      if(ap==='下午'&&h<12)h+=12; if(ap==='晚上'&&h<12)h+=12; if(ap==='中午'&&h===11)h=12; if(ap==='凌晨'&&h===12)h=0;
      if(ap==='中午'&&h<12)h+=12;
      dueTime=String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); s=s.replace(tm2[0],' '); }
  }
  // 2) 日期：绝对
  const today=new Date();
  let dm=s.match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
  if(dm){ due=dm[1]+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[3]).padStart(2,'0'); s=s.replace(dm[0],' '); }
  else{
    dm=s.match(/(\d{1,2})月(\d{1,2})[日号]?/);
    if(dm){ due=ymd(new Date(today.getFullYear(),+dm[1]-1,+dm[2])); s=s.replace(dm[0],' '); }
    else{
      dm=s.match(/(\d{1,2})[\/.](\d{1,2})(?![\d:])/);
      if(dm){ due=ymd(new Date(today.getFullYear(),+dm[1]-1,+dm[2])); s=s.replace(dm[0],' '); }
      else{
        // 3) 相对日期：今天/明天/后天/大后天/周X/下周X
        const relM=s.match(/(大后天|后天|明天|今天|下下周[一二三四五六日天]|下周[一二三四五六日天]|(?:本|这)?周[一二三四五六日天]|周[一二三四五六日天])/);
        if(relM){ const d=todoRelDate(relM[1]); if(d) due=d; s=s.replace(relM[0],' '); }
      }
    }
  }
  // 4) 清理标题：去 截止/DDL/due/之前/前 等修饰词 + 编号/符号前缀
  s=s.replace(/[，,;；、\s]*(截止|截止日期|到期|ddl|due|之前|前|提醒|记得|别忘了)[:：]?\s*/gi,' ');
  s=s.replace(/^[\s\-\*\•·\d\.\)\）、）]+/,'').trim();
  if(!s) return null;
  const title=s.replace(/\s{2,}/g,' ').trim();
  if(!title) return null;
  return {title, due, dueTime, cat:todoGuessCat(title)};
}
function parseTodoText(text){
  const lines=(text||'').replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(s=>s);
  const out=[];
  for(let line of lines){
    if(/^(待办|任务|清单|todo|事项|计划|安排|日程)[:：]?$/i.test(line)) continue;
    const it=parseTodoLine(line);
    if(it) out.push(it);
  }
  return out;
}

function barChart(data,colors){const max=Math.max(1,...data.map(d=>d.v));const w=100,step=w/data.length;let s='<svg viewBox="0 0 '+w+' '+40+'" width="100%" preserveAspectRatio="none" style="display:block">';
  data.forEach((d,i)=>{const h=d.v/max*34;const x=i*step+step*0.15;const bw=step*0.7;s+=`<rect x="${x}" y="${38-h}" width="${bw}" height="${h}" rx="2" style="fill:${colors[i%colors.length]||'var(--accent-soft)'}"><title>${esc(d.l)}: ${d.v}</title></rect>`;});
  s+='</svg><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:3px">'+data.map(d=>'<span>'+esc(d.l)+'</span>').join('')+'</div>';return s;}
function lineChart(data,color){const max=Math.max(1,...data.map(d=>d.v)),min=Math.min(0,...data.map(d=>d.v));const range=max-min||1;const w=100,h=40,step=w/Math.max(1,data.length-1);
  let pts=data.map((d,i)=>`${(i*step).toFixed(1)},${(h-(d.v-min)/range*h).toFixed(1)}`).join(' ');
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="display:block"><polyline points="${pts}" fill="none" style="stroke:${color||'var(--accent)'}" stroke-width="2"/>`;
  data.forEach((d,i)=>{s+=`<circle cx="${(i*step).toFixed(1)}" cy="${(h-(d.v-min)/range*h).toFixed(1)}" r="1.6" style="fill:${color||'var(--accent)'}"><title>${esc(d.l)}: ${d.v}</title></circle>`;});
  return s+'</svg>';}
function pieChart(seg){const total=seg.reduce((a,s)=>a+s.v,0)||1;let acc=0;let s=`<svg viewBox="0 0 40 40" width="100%" style="max-width:150px">`;
  seg.forEach(x=>{const a0=acc/total*360, a1=(acc+x.v)/total*360;acc+=x.v;
    const large=a1-a0>180?1:0;const p=(deg)=>[20+18*Math.cos((deg-90)*Math.PI/180),20+18*Math.sin((deg-90)*Math.PI/180)];

function weekBar(data,colors){

  const todayIdx=(new Date().getDay()+6)%7;
  const max=Math.max(1,...data.map(d=>d.v));
  const w=100, step=w/data.length;
  let s='<svg viewBox="0 0 '+w+' 46" width="100%" preserveAspectRatio="none" style="display:block">';
  data.forEach((d,i)=>{
    const h=Math.max(2,d.v/max*34);
    const x=i*step+step*0.18, bw=step*0.64;
    const isToday=i===todayIdx;
    const fill=isToday?'var(--gold)':(colors[i%colors.length]||'var(--accent-soft)');

  return '未知工具：'+name;

async function aiRun(){
  aiBusy=true;setAiThinking(true);
  try{
    let data=await aiCall(buildAiMessages());
    let rounds=0;
    while(data&&data.choices&&data.choices[0]&&data.choices[0].message&&Array.isArray(data.choices[0].message.tool_calls)&&rounds<2){
      const asm=data.choices[0].message;
      chatMessages.push({role:'assistant',content:asm.content||'',tool_calls:asm.tool_calls});
      for(const tc of asm.tool_calls){let resText='';try{resText=runAiTool(tc.function.name,JSON.parse(tc.function.arguments||'{}'));}catch(err){resText='工具执行失败：'+(err&&err.message||err);}chatMessages.push({role:'tool',tool_call_id:tc.id,content:resText});}
      aiRender();persistActive();rounds++;
      data=await aiCall(buildAiMessages());
    }
    const fm=data&&data.choices&&data.choices[0]&&data.choices[0].message;
    if(fm&&(fm.content||'').trim())chatMessages.push({role:'assistant',content:fm.content});
    else if(data&&data.error)chatMessages.push({role:'assistant',content:'⚠️ '+data.error});
    else chatMessages.push({role:'assistant',content:'⚠️ 模型未返回内容'});
  }catch(err){chatMessages.push({role:'assistant',content:'⚠️ 出错了：'+(err&&err.message||err)});}
  aiBusy=false;setAiThinking(false);aiRender();persistActive();aiRenderSessions();
}
function aiSend(e){
  if(e)e.preventDefault();

}

let srRec=null, srOn=false, srBase='';
function aiInitVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return false;
  try{
    srRec = new SR();
    srRec.lang='zh-CN';
    srRec.interimResults=true;
    srRec.continuous=false;
    srRec.maxAlternatives=1;
    srRec.onresult=(e)=>{
      let fin='', inter='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin+=t; else inter+=t;
      }
      const ta=document.getElementById('aiText');
      if(ta){ ta.value = srBase + fin + inter; autoGrow(ta); }
    };
    srRec.onerror=(ev)=>{
      srOn=false; aiVoiceState(false);
      if(ev && ev.error==='not-allowed'){ aiVoiceWarn('麦克风权限被拒绝，请在系统/浏览器设置中允许后重试。'); }
    };
    srRec.onend=()=>{ srOn=false; aiVoiceState(false); const ta=document.getElementById('aiText'); if(ta) srBase=ta.value||''; };
    return true;
  }catch(err){ return false; }
}
function aiVoiceToggle(){
  if(!srRec){ if(!aiInitVoice()){ aiVoiceWarn('当前环境不支持语音输入（需 Chromium 内核并授权麦克风）。'); return; } }
  if(srOn){ srRec.stop(); return; }
  const ta=document.getElementById('aiText'); srBase = ta?ta.value:'';
  try{ srRec.start(); srOn=true; aiVoiceState(true); if(ta) ta.focus(); }
  catch(err){ srOn=true; aiVoiceState(true); }
}

}

async function aiAddFiles(list){
  const files=Array.prototype.slice.call(list||[]);

    if(aiAtts.length>=6){toast('附件最多 6 个');break;}
    if(f.size>8*1024*1024){toast('「'+f.name+'」超过 8MB，已跳过');continue;}
    let dataUrl='';
    try{dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f);});}catch(err){continue;}
    const isImage=/^image\//.test(f.type);
    let p='';
    try{
      const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,type:f.type,data:String(dataUrl).split(',')[1]||''})});

    }catch(err){}
    aiAtts.push({name:f.name,type:f.type,size:f.size,dataUrl:dataUrl,isImage:isImage,path:p});

  aiRenderAtt();
}

function aiUserContent(text,atts){
  const parts=[];
  const t=String(text||'').trim();
  if(t)parts.push({type:'text',text:t});
  (atts||[]).forEach(function(a){
    if(a.isImage)parts.push({type:'image_url',image_url:{url:a.dataUrl}});
    else parts.push({type:'text',text:'[用户附带了文件：'+a.name+'，已存至 '+(a.path||'本地')+'。模型无法直接读取其正文，请结合文件名与上下文回答；若必须依据正文，请提示用户粘贴关键内容。]'});
  });
  return parts.length?parts:'（无内容）';
}

/* 概览卡片：溢出内容内部下滑，并按滚动位置切换顶端/底端渐变遮罩 */
function setupOvFades(){
  document.querySelectorAll('.ov-body').forEach(function(el){
    const update=function(){
      const over=el.scrollHeight-el.clientHeight;
      el.classList.remove('fade-top','fade-bottom','fade-both');
      if(over<=2)return;
      const st=el.scrollTop, atTop=st<=1, atBot=st>=over-1;
      if(atTop&&!atBot)el.classList.add('fade-bottom');
      else if(atBot&&!atTop)el.classList.add('fade-top');
      else if(!atTop&&!atBot)el.classList.add('fade-both');
    };
    el.addEventListener('scroll',update,{passive:true});
    requestAnimationFrame(update);
    setTimeout(update,80);
  });
}

/* ===== 待办分类 =====
   设计要点：
   1) 先按完成状态切分 —— 未完成走「时间 → 标签」两级分组；已完成进独立「已完成」区（默认收起）。
      原因：勾完的项若继续占着「今日/逾期」的位置和计数，列表会越用越长，且已完成项会永远判定为逾期。
   2) 组内排序：逾期（拖最久的在前）→ 有日期（近的在前）→ 无日期。
   3) 总览所有计数均只统计未完成，回答的是"还剩多少事"，并可「时间 × 标签」双维筛选。 */
function todoBucket(due){
  if(!due)return {key:'nodate',label:'无日期',color:'var(--ink-soft)'};
  const t=todayStr();
  if(due<t)return {key:'overdue',label:'逾期',color:'var(--red)'};
  if(due===t)return {key:'today',label:'今日',color:'var(--accent)'};
  const d1=new Date(t); const d2=new Date(due);
  const diff=Math.round((d2.getTime()-d1.getTime())/(1000*60*60*24));
  if(diff===1)return {key:'tomorrow',label:'明日',color:'var(--gold)'};
  if(diff<=7)return {key:'week',label:'未来 7 天',color:'var(--green)'};
  return {key:'future',label:'更远的未来',color:'var(--ink-soft)'};
}
/* 距今天的天数：负数=已逾期几天，正数=还有几天 */
function todoDays(due){
  if(!due)return 0;
  return Math.round((new Date(due).getTime()-new Date(todayStr()).getTime())/86400000);
}
/* 排序：无日期垫底；有日期按 due 升序（逾期日期最早=拖最久，自然排最前）；再按时间、标题 */
function todoSort(a,b){
  const da=a.due||'9999-12-31', db=b.due||'9999-12-31';
  if(da!==db)return da<db?-1:1;
  const ta=a.dueTime||'99:99', tb=b.dueTime||'99:99';
  if(ta!==tb)return ta<tb?-1:1;
  return String(a.title||'').localeCompare(String(b.title||''),'zh');
}
/* 界面展示的分类顺序：默认六类（科研/学习/运动/生活/工作/其他）在前，仅保留实际有数据的；
   自定义分类（如 学校/创作/副业）按拼音补在后面 —— 添加待办时分类是自由文本，绝不能写死过滤 */
function todoCatOrder(present){
  const set=present instanceof Set?present:new Set(present);
  const extra=[];
  for(const c of set)if(TODO_CATS.indexOf(c)<0)extra.push(c);
  extra.sort((a,b)=>a.localeCompare(b,'zh'));
  return TODO_CATS.concat(extra).filter(c=>set.has(c));
}
/* 只对未完成项做「时间 → 标签」两级分组 */
function groupTodos(todos){
  const order=['overdue','today','tomorrow','week','future','nodate'];
  const groups={};
  order.forEach(k=>groups[k]={items:{},count:0,label:'',color:''});
  for(const t of todos){
    if(t.done)continue;
    const b=todoBucket(t.due);
    const g=groups[b.key];
    g.label=b.label; g.color=b.color;
    g.count++;
    const c=t.cat||'其他';
    (g.items[c]=g.items[c]||[]).push(t);
  }
  order.forEach(k=>{const g=groups[k];Object.keys(g.items).forEach(c=>g.items[c].sort(todoSort));});
  return {order,groups};
}
function todoItemHtml(t,showCat){

  const od=over?Math.abs(todoDays(t.due)):0;
  const catChip=(showCat&&t.cat)?`<span class="tag">${esc(t.cat)}</span>`:'';
  let meta='';
  if(done){
    const at=t.doneAt?String(t.doneAt).slice(0,10):'';
    meta=(at?`<span class="tag green">${esc(at)} 完成</span>`:'')+catChip;
  }else{
    meta=(t.due?`<span class="tag ${over?'red':''}">${esc(t.due)}${t.dueTime?' '+esc(t.dueTime):''}${od?' · 逾期'+od+'天':''}</span>`:'')+catChip;
  }
  return `<div class="item ${done?'done':''}"><button class="mini-btn" data-action="todo-done" data-id="${t.id}">${done?ico('check'):'○'}</button><div class="body"><div class="title">${esc(t.title)}</div>${meta?`<div class="meta">${meta}</div>`:''}</div><button class="mini-btn" data-action="edit" data-coll="todos" data-id="${t.id}" title="编辑">${ico('edit')}</button><button class="mini-btn" data-action="del" data-coll="todos" data-id="${t.id}">${ico('trash')}</button></div>`;

/* 折叠状态：时间组 key 如 today；标签子组 key 为 today::科研；已完成区固定为 __done */
let todoCollapsed={__done:true};
let todoFilterCat=null;      // 按标签筛选
let todoFilterBucket=null;   // 按时间段筛选
const TODO_DONE_CAP=30;      // 已完成区最多展示条数，避免无限增长
/* 返回 {pend, done, doneTotal}：
   时间筛选只作用于未完成（已完成项谈"逾期/今日"没有意义），标签筛选对两者都生效 */
function todoFiltered(){
  const cat=todoFilterCat, bk=todoFilterBucket;
  const pend=[], done=[];
  for(const t of state.todos){
    if(cat&&(t.cat||'其他')!==cat)continue;
    if(t.done){done.push(t);continue;}
    if(bk&&todoBucket(t.due).key!==bk)continue;
    pend.push(t);
  }
  done.sort((a,b)=>String(b.doneAt||'').localeCompare(String(a.doneAt||'')));
  return {pend:pend, done:done.slice(0,TODO_DONE_CAP), doneTotal:done.length};
}
function todoListHtml(pend,done,doneTotal){
  let html='<div class="todo-groups">';
  const {order,groups}=groupTodos(pend);
  let any=false;
  for(const k of order){
    const g=groups[k];
    if(!g.count)continue;
    any=true;
    const collapsed=!!todoCollapsed[k];
    const cats=todoCatOrder(Object.keys(g.items));
    let inner='';
    if(!collapsed){
      inner=cats.map(c=>{
        const sk=k+'::'+c, sc=!!todoCollapsed[sk], items=g.items[c];
        return `<div class="todo-subgroup${sc?' collapsed':''}">`+
          `<button type="button" class="todo-subtitle${sc?' collapsed':''}" data-action="todo-collapse" data-key="${esc(sk)}" data-level="s">`+
          `<span class="chev">▾</span>${esc(c)}<span class="count">${items.length}</span></button>`+
          (sc?'':items.map(t=>todoItemHtml(t,false)).join(''))+`</div>`;
      }).join('');
    }
    html+=`<div class="todo-group${collapsed?' collapsed':''}">`+
      `<button type="button" class="todo-group-title" style="color:${g.color}" data-action="todo-collapse" data-key="${esc(k)}" data-level="g">`+
      `<span class="chev">▾</span>${g.label}<span class="count">${g.count}</span></button>${inner}</div>`;
  }
  if(!any){
    if(todoFilterCat||todoFilterBucket){
      html+='<div class="empty">当前筛选下没有待办　<button type="button" class="sub" data-action="todo-clear-filter" style="cursor:pointer;color:var(--accent)">清除筛选</button></div>';
    }else if(!state.todos.length){
      html+='<div class="empty">点上方「+ 新增」添加待办</div>';
    }
  }
  if(done.length){
    const dc=!!todoCollapsed.__done;
    html+=`<div class="todo-group done-group${dc?' collapsed':''}">`+
      `<button type="button" class="todo-group-title" style="color:var(--ink-soft)" data-action="todo-collapse" data-key="__done" data-level="g">`+
      `<span class="chev">▾</span>已完成<span class="count">${doneTotal}</span></button>`+
      (dc?'':'<div class="todo-subgroup">'+done.map(t=>todoItemHtml(t,true)).join('')+'</div>'+
        (doneTotal>done.length?`<div class="ov-more">仅显示最近 ${done.length} 条，共 ${doneTotal} 条</div>`:''))+
      `</div>`;
  }
  return html+'</div>';
}

/* ===== 周次维度：课程表按周展示 ===== */
function weekRange(cell){
  if(!cell) return null;
  if(typeof cell.wkStart==='number' && typeof cell.wkEnd==='number') return {s:cell.wkStart, e:cell.wkEnd};
  const note=((cell.note||'')+' '+(cell.cls||''));
  const m=note.match(/(\d+)\s*-\s*(\d+)\s*周/);
  if(m) return {s:+m[1], e:+m[2]};
  const m2=note.match(/(\d+)\s*周/);
  if(m2) return {s:+m2[1], e:+m2[1]};
  return null; // 无周次信息 → 视为全学期
}
function courseCurrentWeek(){
  const ss=state.courses.semesterStart;
  if(!ss) return 1;
  const start=new Date(ss+'T00:00:00');
  if(isNaN(start.getTime())) return 1;
  const now=new Date();
  const diff=Math.floor((now-start)/86400000);
  return Math.max(1, Math.floor(diff/7)+1);
}
function courseInWeek(cell, wk){ const r=weekRange(cell); if(!r) return true; return wk>=r.s && wk<=r.e; }

/* ===== 课表导入解析（支持 Excel 复制粘贴 / CSV / xlsx） ===== */
function wdIndex(tok){ if(!tok)return -1; const s=tok.toLowerCase();
  const map=[['周一','周一','星期一','星期1','周1','一','mon','monday'],['周二','周二','星期二','星期2','周2','二','tue','tuesday'],['周三','周三','星期三','星期3','周3','三','wed','wednesday'],['周四','周四','星期四','星期4','周4','四','thu','thursday'],['周五','周五','星期五','星期5','周5','五','fri','friday'],['周六','周六','星期六','星期6','周6','六','sat','saturday'],['周日','周日','星期日','星期7','星期天','周7','日','sun','sunday']];
  for(let i=0;i<map.length;i++){for(const m of map[i]){ if(s.indexOf(m)>=0)return i; }} return -1; }
function splitCell(s){ s=(s||'').trim(); if(!s)return null; const lines=s.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(lines.length===1)return {title:s};
  const title=lines[0]; let teacher='',room='';
  lines.slice(1).forEach(l=>{ if(/室|楼|教|栋|Room|room|机房|^[A-Za-z]?\d/.test(l)||/\d{2,}/.test(l)) room=room?room+' '+l:l; else teacher=teacher?teacher+' '+l:l; });
  return {title,teacher,room}; }
/* ===== 研究生课表（节次/大节 网格）识别：支持北印等校「节次×星期 + 第N节课 + 周次节次合并单元格」格式 ===== */
const COURSE_ROOT_RE=/(外国语|传播|新闻|出版|广告|研究|理论|方法|原理|概论|导论|主义|思想|史|经济|写作|英语|德语|日语|法语|政治|马克思|思政|体育|心理|法律|计算机|健康|文学|历史|哲学|管理|统计|数学|数据|艺术|教育|专题|基础|分析|设计|媒介)/;
const isWeeksCell=s=>/周\s*[（(]\s*\d+\s*-\s*\d+\s*节/.test(s)||(/^\d+\s*-\s*\d+\s*周/.test(s)&&/节/.test(s));
const isRoomCell=s=>/(教学楼|楼|室|校区|研究院|中心|机房|图书馆|馆)/.test(s);
const isClassCell=s=>/(新传|出版|班|级|学硕|硕士|研究生|（.*班）|级\d|选修)/.test(s);
const isPeriodCell=s=>/第\d+节课/.test(s)||/\d{1,2}:\d{2}\s*[~～-]/.test(s);
function isTitleCell(s){ if(!s)return false; if(/(必修|限选|任选)/.test(s))return true; if(/选修/.test(s)&&COURSE_ROOT_RE.test(s))return true; if(isClassCell(s)||isWeeksCell(s)||isRoomCell(s)||isPeriodCell(s))return false; const cn=(s.match(/[一-龥]/g)||[]).length; return cn>=4&&COURSE_ROOT_RE.test(s); }
function isGradTimetable(M){ if(!M||!M.length)return false; let hdr=-1; for(let r=0;r<M.length&&r<8;r++){let c=0;M[r].forEach(cell=>{if(wdIndex(cell)>=0)c++;});if(c>=3){hdr=r;break;}} if(hdr<0)return false; let sig=false; for(let r=0;r<M.length;r++){for(const cell of M[r]){if(/第\d+节课/.test(cell)||/周[（(]\s*\d+\s*-\s*\d+\s*节/.test(cell)||/\d{1,2}:\d{2}\s*[~～-]\s*\d{1,2}:\d{2}/.test(cell)){sig=true;break;}}if(sig)break;} return sig; }
function parseGradTimetable(M){
  const NR=M.length,NC=Math.max.apply(null,M.map(r=>r.length).concat([0]));
  const grid=M.map(r=>{const a=new Array(NC).fill('');for(let c=0;c<NC;c++)a[c]=(r[c]==null?'':String(r[c])).trim();return a;});
  const T=c=>(c==null?'':String(c)).trim();
  let headerRow=-1,wdCols={};
  for(let r=0;r<NR&&r<8;r++){const map={};grid[r].forEach((cell,c)=>{const wi=wdIndex(cell);if(wi>=0)map[c]=wi;});if(Object.keys(map).length>=3){headerRow=r;wdCols=map;break;}}
  if(headerRow<0)return {count:0};
  let timeCol=-1;
  for(let c=0;c<NC;c++){if(String(c) in wdCols)continue;const colTxt=grid.map(row=>row[c]).join(' ');if(/第\d+节课/.test(colTxt)||/\d{1,2}:\d{2}\s*[~～-]\s*\d{1,2}:\d{2}/.test(colTxt)){timeCol=c;break;}}
  const timeRe=/(\d{1,2}):(\d{2})\s*[~～-]\s*\d{1,2}:\d{2}/;
  const periodStart={};let lastN=0;const perNums=[];
  if(timeCol>=0){for(let r=0;r<NR;r++){const cell=grid[r][timeCol];const mN=cell.match(/第(\d+)节课/);if(mN){const n=+mN[1];lastN=n;if(perNums.indexOf(n)<0)perNums.push(n);let t=cell.match(timeRe);if(!t&&r+1<NR)t=grid[r+1][timeCol].match(timeRe);if(t)periodStart[n]=t[1].padStart(2,'0')+':'+t[2];}else{const t=cell.match(timeRe);if(t&&lastN&&!periodStart[lastN])periodStart[lastN]=t[1].padStart(2,'0')+':'+t[2];}}}
  const STD=['08:00','08:50','09:55','10:45','11:35','13:30','14:20','15:25','16:15','17:05'];
  const maxP=perNums.length?Math.max.apply(null,perNums):10;
  const periods=[];for(let n=1;n<=maxP;n++)periods.push(periodStart[n]||STD[n-1]||('P'+n));
  const cells=[];
  Object.keys(wdCols).forEach(ci=>{const wi=wdCols[ci];let r=headerRow+1;
    while(r<NR){const cell=T(grid[r][ci]);
      if(isTitleCell(cell)){const title=cell;let teacher='',room='',cls='',weeks='',sp=1,ep=1,gotRange=false,wkStart=null,wkEnd=null;let rr=r+1;
        while(rr<NR){const c2=T(grid[rr][ci]);
          if(c2){if(isTitleCell(c2))break;
            if(isWeeksCell(c2)){const m=c2.match(/(\d+)\s*-\s*(\d+)\s*周[（(]\s*(\d+)\s*-\s*(\d+)\s*节/)||c2.match(/周[（(]\s*(\d+)\s*-\s*(\d+)\s*节/);if(m){const a=m.length>=5?[+m[3],+m[4]]:[+m[1],+m[2]];sp=Math.min(a[0],a[1]);ep=Math.max(a[0],a[1]);gotRange=true;const wm=c2.match(/(\d+)\s*-\s*(\d+)\s*周/);weeks=wm?wm[0]:c2;if(wm){wkStart=+wm[1];wkEnd=+wm[2];}}}
            else if(isRoomCell(c2)){room=room?room+' '+c2:c2;}
            else if(isClassCell(c2)){cls=cls?cls+' '+c2:c2;}
            else {teacher=teacher?teacher+' '+c2:c2;}}
          else {if(gotRange)break;}
          rr++;}
        if(!gotRange){sp=1;ep=1;}
        for(let p=sp;p<=ep;p++){const pi=p-1;if(pi<0||pi>=periods.length)continue;cells.push({pIndex:pi,ci:wi,title:title,teacher:teacher,room:room,time:periods[pi],note:(weeks?weeks+' ':'')+cls,wkStart:wkStart,wkEnd:wkEnd});}
        r=rr;continue;}
      r++;}
  });
  // 提取开学日期（备注里的「X年X月X日正式上课」）
  let semesterStart=null;
  for(let r=0;r<NR;r++){for(let c2=0;c2<NC;c2++){const t2=T(grid[r][c2]);const md=t2.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);if(md){semesterStart=md[1]+'-'+String(md[2]).padStart(2,'0')+'-'+String(md[3]).padStart(2,'0');break;}}if(semesterStart)break;}
  return {count:cells.length,periods,cells,semesterStart};
}

function parseCourseTable(text){
  const matrix=text.replace(/\r/g,'').split('\n').map(l=>l.split('\t').map(c=>c.trim()));
  if(isGradTimetable(matrix)) return parseGradTimetable(matrix);
  const raw=text.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!raw.length)return {count:0};
  const rows=raw.map(l=>{ const t=l.includes('\t'); const parts=t?l.split('\t'):(l.includes(',')&&!l.includes('，')?l.split(','):[l]); return parts.map(p=>p.trim()); });
  // 宽表检测：首行含≥3个星期列
  const wdCols={}; rows[0].forEach((cell,ci)=>{const wi=wdIndex(cell); if(wi>=0)wdCols[ci]=wi;});
  if(Object.keys(wdCols).length>=3){
    const periods=[]; const cells=[];
    for(let r=1;r<rows.length;r++){ const row=rows[r]; const lbl=row[0]||('第'+r+'节'); const pi=periods.indexOf(lbl); const pIndex=pi<0?(periods.push(lbl)-1):pi;
      Object.keys(wdCols).forEach(ci=>{ const wi=wdCols[ci]; const cell=row[ci]; if(cell&&cell.trim()){ const sp=splitCell(cell); cells.push({pIndex,ci:wi,title:sp.title,teacher:sp.teacher||'',room:sp.room||'',time:'',note:''}); } }); }
    return {count:cells.length,periods,cells};
  }
  // 长表检测：首行含 星期/节次/课程 等
  const head=rows[0].map(c=>c.toLowerCase());
  const colOf=(keys)=>{ for(let i=0;i<head.length;i++){ for(const k of keys){ if(head[i].indexOf(k)>=0)return i; } } return -1; };
  const cDay=colOf(['星期','周','day','日期']), cPer=colOf(['节次','节','period','时间','节数']), cTitle=colOf(['课程','课名','科目','title','course','名称']), cTea=colOf(['教师','老师','teacher','授课']), cRoom=colOf(['地点','教室','room','楼']), cNote=colOf(['备注','note','说明']);
  if(cTitle>=0){
    const periods=[]; const cells=[];
    for(let r=1;r<rows.length;r++){ const row=rows[r]; if(!row[cTitle]||!row[cTitle].trim())continue; const di=cDay>=0?wdIndex(row[cDay]):wdIndex(row[0]); if(di<0)continue;
      const pl=cPer>=0?row[cPer].trim():('第'+r+'节'); const pi=periods.indexOf(pl); const pIndex=pi<0?(periods.push(pl)-1):pi;
      cells.push({pIndex,ci:di,title:row[cTitle].trim(),teacher:cTea>=0?(row[cTea]||'').trim():'',room:cRoom>=0?(row[cRoom]||'').trim():'',time:'',note:cNote>=0?(row[cNote]||'').trim():''}); }
    return {count:cells.length,periods,cells};
  }
  return {count:0};
}
function applyCourseImport(res,clear){
  if(res.semesterStart) state.courses.semesterStart=res.semesterStart;
  if(clear){ state.courses.periods=res.periods.slice(); state.courses.grid={}; }
  else { res.periods.forEach(l=>{ if(!state.courses.periods.includes(l))state.courses.periods.push(l); }); }
  const newGrid=clear?{}:Object.assign({},state.courses.grid);

  const merged={}; // 记录已被上方 cell 合并（rowspan）而跳过的格子
  rows.forEach((t,ri)=>{
    grid+='<tr><td style="padding:5px;white-space:nowrap"><input class="ctime" data-i="'+ri+'" value="'+esc(t)+'" style="width:60px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--surface)"/></td>';
    cols.forEach((c2,ci)=>{
      const key=ri+'-'+ci;
      if(merged[key]) return; // 已被上方同一门课合并，本行不渲染
      const raw=c.grid[key];
      // 按「周次」过滤：只显示本周在上的课；不在本周的当作空
      const v=(raw && courseInWeek(raw,curWeek)) ? raw : null;
      const hl=ci===todayIdx?'today-col':'';

      let rowspan=1, spanEnd=ri;
      if(v){
        const id=(v.title||'')+'|'+(v.teacher||'');
        for(let r2=ri+1;r2<rows.length;r2++){

        const s=(rows[ri]||'').split('-')[0];

        + (v

/* ===== 文献精读（对齐飞书「文献记录表」的字段与视图） =====
   六维字段对应飞书的 6 个「AI 生成」列；视图对应飞书的 5 个预设视图。
   正文抽取放在浏览器端（随包 pdf.js）：手机端没有本地服务，只有浏览器端才双端通用。 */

/* aiCfgOk 只在访问过「智能助手」页后才被赋值；这里主动探一次，避免用户直接来科研页时误报未配置 */
async function ensureAiCfg(){
  if(aiCfgOk)return true;
  try{await aiCheckStatus();}catch(e){}
  return !!aiCfgOk;
}
const LIT_DIMS=[
  ['abstract','摘要'],['findings','核心发现'],['method','研究方法'],
  ['theory','理论视角'],['gap','研究不足'],['future','未来研究方向']
];
const LIT_VIEWS=[
  ['all','全部文献',function(){return true;}],
  ['theory','理论视角',function(p){return (litTags(p,'theoryTags').length>0)||(String(p.theory||'').trim()&&!litPlaceholder(p.theory));}],
  ['media','媒介研究',function(p){return String(p.tags||'').indexOf('媒介研究')>=0;}],
  ['reading','在读',function(p){return (p.status||'待读')==='在读';}],
  ['cite','引用格式库',function(){return true;}]
];
const LIT_STATUS=['待读','在读','精读中','已读','已引用'];
const LIT_TEXT_MAX=20000;   // 单次送模型的正文上限（字），超出会截断并明确告知用户
const LIT_EXTRACT_SYSTEM='你是新闻传播学领域的文献精读助手。用户会给你一篇论文的正文（可能不完整）。请严格依据正文输出一个 JSON 对象，禁止编造正文中没有的信息；正文里确实没有的内容，字符串写「原文未涉及」，无法确定的字段留空字符串。JSON 的键固定为：title, author, year, venue, abstract, findings, method, theory, gap, future, theoryTags。含义：title 论文标题；author 作者（多位用「、」分隔）；year 四位年份；venue 期刊或会议名；abstract 用 2-3 句概括研究问题、分析路径与结论；findings 用 ①②③ 分条列出核心发现；method 研究方法与数据来源；theory 理论框架及其组合方式；gap 作者自述的局限或你能从论证结构看出的不足；future 作者提出的或可延伸的研究方向；theoryTags 理论/视角的规范术语数组（2-4 个，如 ["议程设置理论","框架理论"]）。除 JSON 外不要输出任何其他文字。';

function litTags(p,k){const v=p&&p[k];if(!v)return [];const a=Array.isArray(v)?v:String(v).split(/[,，、;；|]+/);return a.map(function(s){return String(s).trim();}).filter(Boolean);}
function litDimFilled(p){let n=0;LIT_DIMS.forEach(function(d){if(String((p&&p[d[0]])||'').trim())n++;});return n;}
function litSearchText(p){p=p||{};return [p.title,p.author,p.year,p.venue,p.tags,p.key,p.note,p.abstract,p.findings,p.method,p.theory,p.gap,p.future,p.srcName,litTags(p,'theoryTags').join(' ')].join(' ').toLowerCase();}
function litTimeStr(ts){if(!ts)return '';const d=new Date(ts);if(isNaN(d.getTime()))return '';const z=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
/* 引用格式：APA 第 7 版（中文文献同构），与飞书的「引用格式」公式列一致 */
function apaCite(p){
  p=p||{};
  const a=String(p.author||'').trim(), y=String(p.year||'').trim();
  const t=String(p.title||'').trim(), v=String(p.venue||'').trim();
  if(!t&&!a)return '';
  let s='';
  if(a)s+=a+' ';
  if(y)s+='('+y+'). ';
  if(t)s+=t+'. ';
  if(v)s+=v+'.';
  return s.trim();
}
function copyText(str,okMsg){
  const done=function(){toast(okMsg||'已复制到剪贴板','gold');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(done,function(){fallbackCopy(str);done();});}
    else{fallbackCopy(str);done();}
  }catch(e){fallbackCopy(str);done();}
}
function litFileUrl(f){return '/'+String(f||'').replace(/^\/+/,'');}
function litFileReady(p){
  if(!p)return false;
  if(!p.file)return false;
  /* 手机端导入的记录没有落地文件，不能当成可打开 */
  return true;
}

/* ---------- PDF 正文抽取（浏览器端 pdf.js） ---------- */
let _pdfjsMod=null;
async function loadPdfJs(){
  if(_pdfjsMod)return _pdfjsMod;
  const m=await import('./vendor/pdfjs/pdf.min.mjs');
  try{m.GlobalWorkerOptions.workerSrc='./vendor/pdfjs/pdf.worker.min.mjs';}catch(e){}
  _pdfjsMod=m;
  return m;
}
/* src 可以是 URL 字符串，也可以是 File / Blob（导入时用） */
async function pdfExtract(src){
  const pdfjs=await loadPdfJs();
  let opts;
  if(typeof src==='string'){opts={url:src};}
  else{const buf=await src.arrayBuffer();opts={data:new Uint8Array(buf)};}
  const doc=await pdfjs.getDocument(opts).promise;
  let out='';
  const total=doc.numPages;
  for(let i=1;i<=total;i++){
    const pg=await doc.getPage(i);
    const tc=await pg.getTextContent();
    out+=tc.items.map(function(it){return it.str;}).join('')+'\n';
    if(out.length>LIT_TEXT_MAX+6000)break;
    if(i>=120)break;
  }
  try{doc.destroy();}catch(e){}
  return {text:out.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(),pages:total};
}
function parseJsonLoose(s){
  s=String(s||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<=a)return null;
  try{return JSON.parse(s.slice(a,b+1));}catch(e){return null;}
}
/* 模型「原文没写」类占位语。六维里保留它是有用信息（说明原文确实没谈），
   但题录字段必须清掉，否则引用格式库会拼出「原文未涉及 (2022). 标题. 来源.」这种垃圾引文。 */
function litPlaceholder(v){
  const t=String(v==null?'':v).trim();
  return /^(原文未(明确)?(涉及|提及|说明|陈述|讨论|交代|给出|标注)|未涉及|未提及|未提供|未标注|无|不详|未知|暂无|none|null|n\/a|not\s+(mentioned|specified|stated|applicable|available))$/i.test(t);
}
function normalizeLitObj(o){
  const out={};
  ['title','author','year','venue','abstract','findings','method','theory','gap','future'].forEach(function(k){out[k]=String(o&&o[k]!=null?o[k]:'').trim();});
  out.year=(out.year.match(/\d{4}/)||[''])[0];
  ['title','author','venue'].forEach(function(k){if(litPlaceholder(out[k]))out[k]='';});
  LIT_DIMS.forEach(function(d){if(litPlaceholder(out[d[0]]))out[d[0]]='原文未涉及';});
  let tt=o&&o.theoryTags;
  if(typeof tt==='string')tt=tt.split(/[,，、;；|]+/);
  out.theoryTags=Array.isArray(tt)?tt.map(function(x){return String(x).trim().replace(/^[\[\]\s\x22\x27]+|[\[\]\s\x22\x27]+$/g,'').trim();}).filter(Boolean).slice(0,6):[];
  return out;
}
/* 核心解读：低温 + JSON 校验 + 失败重试一次。只有拿到 ≥4 个有效维度才算成功，绝不让残缺结果落库 */
async function litAnalyzeCore(text,base){
  const body=String(text||'').trim();
  const chars=body.replace(/\s/g,'').length;
  if(chars<200)return {ok:false,error:'正文不足 200 字（实际 '+chars+' 字）'};
  const clipped=body.slice(0,LIT_TEXT_MAX);
  const head='论文'+(base&&base.title?('《'+base.title+'》'):'')+'。\n\n正文：\n';
  let lastErr='';
  for(let attempt=0;attempt<2;attempt++){
    const extra=attempt?'\n\n（注意：上一次你的输出不是合法 JSON。这一次只输出一个 JSON 对象，不要解释、不要 markdown 代码块、不要省略大括号。）':'';
    let data=null;
    try{data=await aiCall([{role:'system',content:LIT_EXTRACT_SYSTEM},{role:'user',content:head+clipped+extra}],true,{temperature:0.2});}
    catch(e){lastErr=(e&&e.message)||String(e);continue;}
    const msg=data&&data.choices&&data.choices[0]&&data.choices[0].message;
    if(!msg||!msg.content){lastErr=(data&&data.error)||'模型未返回内容';continue;}
    const o=parseJsonLoose(msg.content);
    if(!o){lastErr='模型返回的不是 JSON';continue;}
    const o2=normalizeLitObj(o);
    const n=litDimFilled(o2);
    if(n<4){lastErr='有效维度只有 '+n+'/6，结果不可靠';continue;}
    return {ok:true,obj:o2,chars:chars,truncated:chars>LIT_TEXT_MAX};
  }
  return {ok:false,error:lastErr||'未知错误'};
}
/* 把解读结果写回一条已有文献；题录字段只补空、不覆盖用户手填 */
async function litAnalyzeText(id,text,pages){
  const p=(state.research.papers||[]).filter(function(x){return x.id===id;})[0];
  if(!p){toast('找不到这篇文献','warn');return;}
  const note=document.getElementById('litAnote_'+id);
  const say=function(html){if(note)note.innerHTML=html;};
  if(!(await ensureAiCfg())){say('<span class="warn-t">还没配置模型：去「对话」页点右上角「模型」，填 API Key 与接口地址后重试。</span>');return;}
  say('<span class="muted">正在解读…（约 10-30 秒，会先校验结果再落库）</span>');
  const r=await litAnalyzeCore(text,{title:p.title});
  if(!r.ok){say('<span class="warn-t">解读未通过校验：'+esc(r.error)+'。可以重试一次，或换一段更完整的正文。</span>');return;}
  const o=r.obj;
  let n=0;
  LIT_DIMS.forEach(function(d){if(o[d[0]]){p[d[0]]=o[d[0]];n++;}});
  if(!String(p.title||'').trim()&&o.title)p.title=o.title;
  if(!String(p.author||'').trim()&&o.author)p.author=o.author;
  if(!String(p.year||'').trim()&&o.year)p.year=o.year;
  if(!String(p.venue||'').trim()&&o.venue)p.venue=o.venue;
  if(o.theoryTags&&o.theoryTags.length){
    const cur=litTags(p,'theoryTags');
    const m=cur.concat(o.theoryTags);
    p.theoryTags=m.filter(function(s,i){return s&&m.indexOf(s)===i;});
  }
  if(!p.status||p.status==='待读')p.status='在读';
  p.aiMeta={at:now(),chars:r.chars,pages:pages||0,truncated:!!r.truncated};
  save();
  renderView();
  toast('解读完成，写入 '+n+' 项'+(r.truncated?('（正文较长，取前 '+LIT_TEXT_MAX+' 字）'):''),'gold');
}
/* 从已挂的 PDF 抽正文再解读；抽不到就引导改用「粘贴正文」 */
async function litAnalyze(id){
  const p=(state.research.papers||[]).filter(function(x){return x.id===id;})[0];
  if(!p)return;
  const note=document.getElementById('litAnote_'+id);
  const say=function(html){if(note)note.innerHTML=html;};
  if(!(await ensureAiCfg())){say('<span class="warn-t">还没配置模型：去「对话」页点右上角「模型」填 API Key。</span>');return;}
  if(!p.file){say('<span class="warn-t">这篇没关联 PDF。点「粘贴正文」直接贴摘要或正文片段即可解读。</span>');return;}
  say('<span class="muted">正在解析 PDF 正文…</span>');
  let r=null;
  try{r=await pdfExtract(litFileUrl(p.file));}
  catch(e){say('<span class="warn-t">PDF 解析失败：'+esc((e&&e.message)||String(e))+'。可改用「粘贴正文」。</span>');return;}

let pdfSt=null;
async function litRead(id){
  const p=(state.research.papers||[]).filter(function(x){return x.id===id;})[0];
  if(!p){toast('找不到这篇文献','warn');return;}
  if(!p.file){
    toast(p.srcName?('这篇的原件没保存（手机端导入）：'+p.srcName):'这篇没有关联 PDF','warn');
    return;
  }
  const url=litFileUrl(p.file);
  openModal('阅读 · '+String(p.title||'PDF').slice(0,22),'<div class="pdf-bar"><button class="btn ghost sm" data-action="pdf-prev">‹ 上一页</button><span class="muted" id="pdfInfo" style="font-size:12px;min-width:96px;text-align:center">载入中…</span><button class="btn ghost sm" data-action="pdf-next">下一页 ›</button><span style="flex:1"></span><button class="btn ghost sm" data-action="pdf-zoom" data-d="-1">缩小</button><button class="btn ghost sm" data-action="pdf-zoom" data-d="1">放大</button><a class="btn ghost sm" href="'+esc(url)+'" target="_blank" rel="noopener">新标签</a></div><div class="pdf-stage" id="pdfStage"></div>');
  pdfSt={url:url,doc:null,page:1,scale:1.2,pages:0};
  const stage=document.getElementById('pdfStage');
  try{
    const pdfjs=await loadPdfJs();
    pdfSt.doc=await pdfjs.getDocument({url:url}).promise;
    pdfSt.pages=pdfSt.doc.numPages;
    await pdfRenderPage();
  }catch(e){
    if(stage)stage.innerHTML='<div class="muted" style="padding:26px;text-align:center;font-size:12.5px;line-height:1.8">PDF 打不开：'+esc((e&&e.message)||String(e))+'<br>可以直接用「新标签」打开，或用系统阅读器看：<br><code style="font-size:11px">'+esc(String(p.file))+'</code></div>';
  }
}
async function pdfRenderPage(){
  if(!pdfSt||!pdfSt.doc)return;
  const stage=document.getElementById('pdfStage');
  if(!stage)return;
  try{
    const pg=await pdfSt.doc.getPage(pdfSt.page);
    const vp0=pg.getViewport({scale:1});
    const availW=Math.max(240,(stage.clientWidth||360)-2);
    const vp=pg.getViewport({scale:(availW/vp0.width)*pdfSt.scale});
    const cv=document.createElement('canvas');
    cv.width=Math.floor(vp.width);
    cv.height=Math.floor(vp.height);
    cv.style.width='100%';
    cv.style.height='auto';
    cv.style.display='block';
    cv.style.borderRadius='8px';
    stage.innerHTML='';
    stage.appendChild(cv);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const info=document.getElementById('pdfInfo');
    if(info)info.textContent='第 '+pdfSt.page+' / '+pdfSt.pages+' 页';
  }catch(e){
    const info=document.getElementById('pdfInfo');
    if(info)info.textContent='渲染失败';
  }
}
async function pdfStep(d){
  if(!pdfSt||!pdfSt.doc)return;
  const np=pdfSt.page+d;
  if(np<1||np>pdfSt.pages){toast(d>0?'已经是最后一页':'已经是第一页');return;}
  pdfSt.page=np;
  await pdfRenderPage();
}
async function pdfZoom(d){
  if(!pdfSt)return;
  pdfSt.scale=Math.max(0.6,Math.min(2.6,pdfSt.scale+d*0.25));
  await pdfRenderPage();
}

function cleanPdfName(n){

function litImportAdd(files){
  const arr=Array.prototype.slice.call(files||[]);
  let skip=0;
  arr.forEach(function(f){
    const isPdf=/pdf$/i.test(f.type||'')||/\.pdf$/i.test(f.name||'');
    if(!isPdf){skip++;return;}
    if(f.size>30*1024*1024){impFiles.push({file:f,name:f.name,size:f.size,status:'error',msg:'超过 30MB，已跳过'});return;}
    impFiles.push({file:f,name:f.name,size:f.size,status:'pending',msg:''});
  });
  if(skip)toast('已跳过 '+skip+' 个非 PDF 文件','warn');
  litImportRender();
}

  const box=document.getElementById('impList');

  box.innerHTML=impFiles.length?impFiles.map(function(it,i){
    const cls=it.status==='done'?'ok':(it.status==='error'?'err':(it.status==='working'?'run':''));
    return '<div class="imp-item '+cls+'"><span class="imp-n">'+(i+1)+'</span><span class="imp-name" title="'+esc(it.name)+'">'+esc(it.name)+'</span><span class="imp-size">'+fmtBytes(it.size)+'</span><span class="imp-msg">'+esc(it.msg||'待导入')+'</span></div>';

async function litImportRun(){
  if(impBusy)return;
  const doA=!!(document.getElementById('impAnalyze')||{}).checked;
  const todo=impFiles.filter(function(it){return it.status==='pending';});
  if(!todo.length){toast('没有待导入的文件','warn');return;}
  if(doA&&!(await ensureAiCfg())){
    toast('没配置模型，已改为只登记题录（可取消勾选后直接导入）','warn');
  }
  impBusy=true;
  litImportRender();
  let ok=0,fail=0;
  for(const it of impFiles){
    if(it.status!=='pending')continue;
    it.status='working';
    try{
      let path='';
      if(USE_API){
        it.msg='上传原件…';
        litImportRender();
        try{
          const b64=await fileToB64(it.file);
          const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:it.name,type:'application/pdf',data:b64})});
          const j=await r.json();
          if(j&&j.ok)path=j.path;
        }catch(e){}
      }
      it.msg='解析正文…';
      litImportRender();
      let text='',pages=0;
      try{const px=await pdfExtract(it.file);text=px.text;pages=px.pages;}catch(e){}
      const chars=text.replace(/\s/g,'').length;
      let obj=null;
      if(doA&&chars>=200){
        it.msg='AI 解读中…';
        litImportRender();
        const r2=await litAnalyzeCore(text,{title:cleanPdfName(it.name)});
        if(r2.ok)obj=r2.obj;
      }
      state.research.papers.push(paperFromImport(it,obj,path,chars,pages));
      it.status='done';
      it.msg=obj?('已入库 · 六维 '+litDimFilled(obj)+'/6'):('已入库 · 仅题录'+(chars<200?'（未提到正文）':''));
      ok++;
      addXP(3);
    }catch(e){
      it.status='error';
      it.msg='失败：'+((e&&e.message)||e);
      fail++;
    }
    litImportRender();
    save();
  }
  impBusy=false;
  checkAch();
  renderView();
  litImportRender();
  toast('导入完成：成功 '+ok+' 篇'+(fail?('，失败 '+fail+' 篇'):''),fail?'warn':'gold');
}

    +'<div class="title">'+(on?'':(open?'▾ ':'▸ '))+esc(p.title||'')+(done>=6?' <span class="tag green">已精读</span>':'')+'</div>'
    +'<div class="meta">'+esc(p.author||'')+(p.year?(' · '+esc(p.year)):'')+(p.venue?(' · '+esc(p.venue)):'')+' <span class="tag">'+esc(p.status||'待读')+'</span>'+(p.cited?'<span class="tag gold">已引用</span>':'')+((done>0&&done<6)?('<span class="tag accent">六维 '+done+'/6</span>'):'')+(p.file?'':'<span class="tag warn">无原件</span>')+'</div>'
    +((!open&&(tt.length||tg.length))?('<div class="meta lit-tagline">'+tt.map(function(t){return '<span class="tag accent">'+esc(t)+'</span>';}).join(' ')+tg.map(function(t){return '<span class="tag gold">'+esc(t)+'</span>';}).join(' ')+'</div>'):'')

      +'<button class="btn ghost sm" data-action="lit-sel-'+(litSelOn?'off':'on')+'">'+(litSelOn?'退出多选':'多选')+'</button>'
    +'</div>'
    +(litFilterOpen?('<div class="lit-fbar"><span class="lit-flab">视图</span><div class="insp-chips">'+vChips+'</div></div>'
      +'<div class="lit-fbar"><span class="lit-flab">状态</span><div class="insp-chips">'+sChips+'</div></div>'):'')
    +litSelBarHtml(visibleIds)

    +'<div class="lit-btns"><button class="btn ghost sm" data-action="lit-import">导入 PDF（可批量）</button><button class="btn ghost sm" data-action="zotero-import">Zotero / BibTeX 导入</button><button class="btn ghost sm" data-action="add-paper">+ 新增一条</button></div>'

function resAiSend(text){

/* 供全局系统提示引用的「科研进程快照」：文献库明细 + 研究问题 / 里程碑 / 在途稿件 */
function litContextBlock(){
  const R=state.research||{};
  const ps=(R.papers||[]).slice(0,40);
  let s='【文献库共 '+(R.papers||[]).length+' 篇（最多列 40 篇明细）】\n';
  s+=(ps.map(function(p){
    return '· '+[p.title,p.author,p.year,p.venue,p.status].filter(Boolean).join(' | ')
      +(litTags(p,'theoryTags').length?(' | 理论视角标签:'+litTags(p,'theoryTags').join('/')):'')
      +(litTags(p,'tags').length?(' | 分类:'+litTags(p,'tags').join('/')):'')
      +' | 六维:'+litDimFilled(p)+'/6'
      +(p.file?'':' | 无原件')
      +(String(p.gap||'').trim()?(' | 研究不足:'+String(p.gap).slice(0,60)):'');
  }).join('\n')||'（无）');
  s+='\n\n【研究问题 '+(R.questions||[]).length+' 个】'+(((R.questions||[]).slice(0,8).map(function(q){return '\n· '+(q.text||'')+'（'+(q.status||'草案')+'）';}).join(''))||'（无）');
  s+='\n\n【里程碑 '+(R.milestones||[]).length+' 项】'+(((R.milestones||[]).slice(0,10).map(function(m){return '\n· '+(m.title||'')+' | 阶段:'+(m.phase||'')+' | 状态:'+(m.status||'')+' | 进度:'+(m.progress||0)+'%';}).join(''))||'（无）');
  const wip=(R.manuscripts||[]).filter(function(m){return ['投稿','审稿中','修改'].indexOf(m.status)>=0;});
  s+='\n\n【在途稿件】'+((wip.map(function(m){return '\n· '+(m.title||'')+' | '+(m.status||'')+' | '+(m.venue||'');}).join(''))||'（无）');
  return s;
}
/* 打开本机目录（只放行 media / data / backups，服务端再校验一次） */
async function openFolder(what){
  if(!USE_API){toast('手机端没有本机目录，请在电脑端操作','warn');return;}
  try{
    const r=await fetch('/api/open-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({which:what||'media'})});
    const j=await r.json();
    if(j&&j.ok)toast('已打开文件夹','gold');
    else toast('打开失败：'+((j&&j.error)||'未知原因'),'warn');
  }catch(e){toast('打开失败：'+((e&&e.message)||e),'warn');}
}

/* 预编译匹配器：中文关键词用子串匹配；英文关键词用 \b 词边界匹配，避免 ai/ar 误命中 campaign、'ar' 等 */
var TAG_MATCHERS=TAG_TAXONOMY.map(function(tx){
  var regs=tx.kw.map(function(kw){
    if(/[^\x00-\x7F]/.test(kw)){ return {cjk:true,kw:kw.toLowerCase()}; }
    try{ return {re:new RegExp('\\b'+kw.toLowerCase().replace(/[\s]+/g,'[\\\\s-]*')+'\\b','i')}; }
    catch(e){ return {cjk:true,kw:kw.toLowerCase()}; }
  });
  return {tag:tx.tag,regs:regs};
});
function getArticleTags(a){
  if(a._tags) return a._tags;
  var hay=((a.title||'')+' '+(a.journal||'')+' '+(a.abstract||'')).toLowerCase();
  var t=[];
  for(var i=0;i<TAG_MATCHERS.length;i++){
    var m=TAG_MATCHERS[i];
    for(var k=0;k<m.regs.length;k++){
      var r=m.regs[k];
      if(r.cjk){ if(hay.indexOf(r.kw)>=0){ t.push(m.tag); break; } }
      else { if(r.re.test(hay)){ t.push(m.tag); break; } }
    }
  }
  a._tags=t;
  return t;
}
