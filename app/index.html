function parseCnMeta(text){
  var lines=String(text||'').split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
  if(!lines.length) return [];
  var idx={title:-1,authors:-1,journal:-1,year:-1,doi:-1,issn:-1};
  var first=lines[0];
  if(/题名|标题|title|作者|author|刊名|期刊|journal|年份|年|year|doi|issn/i.test(first) && (first.indexOf('|')>=0||first.indexOf('\t')>=0)){
    var cells=first.split(/\||\t/).map(function(s){return s.trim();});
    cells.forEach(function(c,i){if(/题名|标题|title/.test(c))idx.title=i;else if(/作者|author/.test(c))idx.authors=i;else if(/刊名|期刊|journal|source/.test(c))idx.journal=i;else if(/年份|年|year/.test(c))idx.year=i;else if(/doi/.test(c))idx.doi=i;else if(/issn/.test(c))idx.issn=i;});
    lines=lines.slice(1);
  }
  return lines.map(function(ln){
    var parts=ln.split(/\||\t/).map(function(s){return s.trim();});
    if(parts.length===1) parts=ln.split(',').map(function(s){return s.trim();});
    function g(i){return i>=0&&parts[i]!=null?parts[i]:'';}
    return {id:uid(),title:idx.title>=0?g(idx.title):(parts[0]||''),authors:idx.authors>=0?g(idx.authors):(parts[1]||''),journal:idx.journal>=0?g(idx.journal):(parts[2]||''),year:idx.year>=0?g(idx.year):(parts[3]||''),doi:idx.doi>=0?g(idx.doi):(parts[4]||''),issn:idx.issn>=0?g(idx.issn):(parts[5]||''),note:parts[6]||'',added:todayStr()};
  }).filter(function(r){return r.title;});
}
function exportCnMeta(){
  var cn=state.research.journals.cnMeta||[];
  if(!cn.length){toast('没有可导出的记录','warn');return;}
  var cols=['题名','作者','刊名','年份','DOI','ISSN','备注','添加日期'];
  var rows=cn.map(function(r){return [r.title,r.authors,r.journal,r.year,r.doi,r.issn,r.note,r.added];});
  var csv='﻿'+cols.join(',')+'\n'+rows.map(function(row){return row.map(function(c){var s=String(c==null?'':c);if(/[",\n]/.test(s))s='"'+s.replace(/"/g,'""')+'"';return s;}).join(',');}).join('\n');
  try{var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='中文刊元数据_'+todayStr()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);if(a.parentNode)a.parentNode.removeChild(a);},2000);toast('已导出 '+cn.length+' 条到 CSV','gold');}catch(e){toast('导出失败：'+e.message,'warn');}
}

function doSearch(q){

let hotErr='';
/* 浏览器可直接访问的聚合源（带 CORS），用于手机端/静态版兜底 */
const HOT_DIRECT={'微博热搜':'https://60s.viki.moe/v2/weibo','抖音热点':'https://60s.viki.moe/v2/douyin','知乎热榜':'https://60s.viki.moe/v2/zhihu'};
async function hotFetchDirect(tab){
  const url=HOT_DIRECT[tab];if(!url)return [];
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),6000);
    const r=await fetch(url,{signal:c.signal});clearTimeout(t);
    if(!r.ok)return [];
    const j=await r.json();
    const arr=(j&&Array.isArray(j.data))?j.data:[];
    return arr.slice(0,30).map((it,i)=>({rk:i+1,title:String(it.title||''),url:String(it.link||it.url||''),meta:it.hot_value?('热度 '+(+it.hot_value>=10000?((+it.hot_value)/10000).toFixed(1)+'万':it.hot_value)):(it.hot?String(it.hot):''),source:tab}));
  }catch(e){return [];}
}
async function fetchHot(force){
  hotErr='';
  let serverOk=false;
  if(USE_API){
    try{const r=await fetch('/api/hot'+(force?'?refresh=1':''),{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.categories)hotData=j;serverOk=true;}}catch(e){}
    // 自定义来源：POST 给本服务代理抓取并合并进分类
    const srcs=(state.news&&state.news.sources)||[];
    if(srcs.length&&serverOk){
      try{
        const r2=await fetch('/api/hot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sources:srcs})});
        if(r2.ok){const j2=await r2.json();if(j2&&j2.categories){hotData.categories=Object.assign({},hotData.categories,j2.categories);}}
      }catch(e){}
    }
  }
  // 直连兜底：服务不可用或某平台缺失时，尝试浏览器可直连的聚合源
  const live=['微博热搜','抖音热点','知乎热榜'];
  let directGot=0;
  for(const tab of live){
    if(hotData.categories[tab]&&hotData.categories[tab].length)continue;
    const arr=await hotFetchDirect(tab);
    if(arr.length){hotData.categories[tab]=arr;directGot++;}
  }
  if(!serverOk&&!directGot)hotErr='当前网络无法连接任何聚合源。若在本机电脑端打开(通过 server.js)，抓取范围更全（含学术前沿）。';
  else if(directGot&&!serverOk)hotErr='手机端已直连可用源（本机端数据更全）。';
  else if(serverOk&&!hotData.categories['微博热搜']&&!hotData.categories['抖音热点']&&!hotData.categories['知乎热榜'])hotErr='后端聚合源暂时不可用，已尝试直连兜底失败。';
  return hotData;
}

  baseList.forEach(it=>newsTopicsOf(it).forEach(tid=>{topicCount[tid]=(topicCount[tid]||0)+1;}));
  const filterTags=[{id:'all',label:'全部',cnt:baseList.length}].concat(NEWS_TOPICS.map(t=>({id:t.id,label:t.label,cnt:topicCount[t.id]||0})));
  const filterBar=`<div class="news-filter-bar">${filterTags.map(f=>`<span class="news-filter-chip ${newsFilter===f.id?'active':''}" data-action="news-filter" data-f="${f.id}">${f.label}${f.cnt?`<span style="opacity:.6;margin-left:3px;font-size:10px">${f.cnt}</span>`:''}</span>`).join('')}</div>`;

  // 4) 统一卡片渲染（实时 / 收藏共用一套结构）
  const isCollected=title=>state.news.saved.some(n=>n.title===title);
  const cardHtml=(it,opts)=>{
    const src=esc(it.source||tab);
    const tops=newsTopicsOf(it).map(tid=>{const t=NEWS_TOPICS.find(x=>x.id===tid);return t?`<span class="news-card-tag">${t.label}</span>`:'';}).join('');
    const ic=TAB_ICON[isSaved?(it.source||''):tab]||'🔗';
    const actions=opts.saved
      ? `<button class="mini-btn" data-action="edit" data-coll="news.saved" data-id="${it.id}" title="编辑">${ico('edit')}</button><button class="mini-btn" data-action="del" data-coll="news.saved" data-id="${it.id}">${ico('trash')}</button><span class="news-saved-badge">★ 已收藏</span>`
      : (isCollected(it.title)?`<span class="news-saved-badge">★ 已收藏</span>`:`<button class="news-save-btn" data-action="news-save" data-title="${encodeURIComponent(it.title)}" data-url="${encodeURIComponent(it.url||'')}" data-source="${esc(tab)}">★ 收藏</button>`);
    const href=it.url?esc(it.url):'';
    return `<div class="news-card">
      <div class="news-card-thumb"><span class="thumb-icon">${ic}</span></div>
      <div class="news-card-body">
        <div class="news-card-title">${href?`<a href="${href}" target="_blank" rel="noopener" title="点开查看原文">${esc(it.title)}</a>`:esc(it.title)}</div>
        <div class="news-card-meta">
          ${it.rk&&!opts.saved?`<span class="news-card-rank">#${it.rk}</span>`:''}
          <span class="news-card-source">${src}</span>
          ${it.meta?`<span class="news-card-hot">${esc(it.meta)}</span>`:''}
          ${href?`<a href="${href}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">原文 ↗</a>`:''}
        </div>
        ${tops?`<div class="news-card-tags">${tops}</div>`:''}
        ${opts.note?`<div class="muted" style="font-size:11.5px;margin-top:2px">${esc(opts.note)}</div>`:''}
        <div class="news-card-actions">${actions}</div>
      </div>
    </div>`;
  };

  // 5) 应用主题筛选 + 组装列表
  let list=baseList;
  if(newsFilter!=='all') list=list.filter(it=>newsTopicsOf(it).includes(newsFilter));
  const feedHtml=list.length
    ? list.map(it=>cardHtml(it,{saved:isSaved,note:it.note})).join('')
    : `<div class="empty">${isSaved?'还没有收藏。在其它标签点 ★ 即可收藏热点。':((tab==='学术前沿'||tab==='小红书')?'「'+esc(tab)+'」需要在本机电脑端获取（电脑上打开数据更全）；手机端可直接使用 微博 / 抖音 / 知乎 三个标签。':(hotErr||'暂无数据：当前来源暂未返回内容，点右上角 🔄 刷新重试'))}</div>`;

  // 6) 组装页面
  const updated=hotData.updated?new Date(hotData.updated).toLocaleTimeString('zh-CN'):'';
  const info=`微博 / 抖音 / 知乎来自公开聚合源实时抓取（本机优先走后端代理，手机端自动直连可用源）；学术前沿与小某书仅在本机电脑端提供。仅展示标题、热度与原文链接，点标题或「原文 ↗」跳原平台查看。${updated?' · 更新于 '+updated:''}`;
  const foot=isSaved?`<button class="btn ghost sm" style="margin-top:10px" data-action="add-news">+ 手动收藏</button>`:'';
  return `<div class="card news-main"><h3>${ico('news')} 时事热点 <span class="sub">实时抓取 · 分门别类</span></h3>
    <div class="news-head">
      <div class="news-tabs">${tabsHtml}</div>
      <div class="news-tools"><button class="btn ghost sm" data-action="news-refresh" title="刷新">🔄</button><button class="btn ghost sm" data-action="news-addsrc" title="添加自定义来源">＋</button></div>
    </div>
    <div class="muted news-meta">${info}</div>
    ${filterBar}
    <div class="news-feed">${feedHtml}</div>
    ${foot}
  </div>`;
}

function ensureDaily(){
  const t=todayStr();
  let r=state.reviews.daily.find(x=>x.date===t);
  if(!r){r={id:uid(),date:t,items:[],hidden:[],focus:'',block:'',note:'',saved:false};state.reviews.daily.push(r);}
  if(!Array.isArray(r.items)){
    const legacy=(r.done!=null&&r.done!=='')?[{text:String(r.done),src:'manual'}]:[];
    r.items=legacy; r.hidden=r.hidden||[]; r.saved=('done' in r)||!!r.saved; delete r.done;
  }
  if(!Array.isArray(r.hidden))r.hidden=[];
  return r;
}
// 汇总「今天」其它版块里已完成的任务，供复盘自动同步
function todayDoneItems(){
  const t=todayStr();
  const items=[];
  state.timeBlocks.filter(b=>b.date===t&&b.done).forEach(b=>items.push({key:'tb_'+b.id,text:(b.cat?b.cat+' · ':'')+(b.title||'时间块')}));
  state.workouts.filter(w=>w.date===t).forEach(w=>items.push({key:'wk_'+w.id,text:'运动 · '+(w.type||'打卡')}));
  state.todos.filter(x=>x.done&&x.doneAt&&x.doneAt.slice(0,10)===t).forEach(x=>items.push({key:'td_'+x.id,text:'待办 · '+(x.title||'任务')}));
  state.studyPlans.forEach(p=>p.steps.forEach((s,si)=>{if(s.done&&s.doneAt&&s.doneAt.slice(0,10)===t)items.push({key:'sp_'+p.id+'_'+si,text:'学习 · '+(s.t||'步骤')});}));
  state.research.tasks.filter(x=>x.done&&x.doneAt&&x.doneAt.slice(0,10)===t).forEach(x=>items.push({key:'rt_'+x.id,text:'科研 · '+(x.title||'任务')}));
  return items;
}
// 渲染「完成项」列表到 #r_dones（局部刷新，不丢其它字段）
function renderDoneList(){
  const box=document.getElementById('r_dones');
  if(!box)return;
  const r=ensureDaily();
  const hidden=r.hidden||[];
  const live=todayDoneItems().filter(a=>!hidden.includes(a.key));
  const rows=[];
  live.forEach(a=>{const ex=(r.items||[]).find(x=>x.src==='auto'&&x.key===a.key);rows.push(doneRow(ex?ex.text:a.text,'auto:'+a.key,true));});
  (r.items||[]).filter(x=>x.src==='manual').forEach((it,mi)=>rows.push(doneRow(it.text,'m:'+mi,false)));
  box.innerHTML=rows.join('')||'<div class="empty" style="padding:8px 2px">其它版块勾掉的任务会自动汇总到这里；也可以直接在下面回车补充。</div>';
}
function doneRow(text,key,isAuto){
  const mi=key.indexOf(':');const ref=key.slice(mi+1);
  return `<div class="done-row">
    <span class="done-dot ${isAuto?'synced':''}"></span>
    <span class="done-text" contenteditable="true" data-mi="${esc(ref)}" ${isAuto?`data-key="${esc(ref)}"`:''} title="点此编辑，回车保存">${esc(text)}</span>
    ${isAuto?'<span class="done-tag">同步</span>':''}
    <button class="done-x" data-action="done-remove" data-mi="${esc(ref)}" ${isAuto?`data-key="${esc(ref)}"`:''} title="移除">×</button>
  </div>`;
}
function addManualDone(){
  const inp=document.getElementById('r_done_input');
  if(!inp)return;
  const val=inp.value.trim();
  if(!val)return;
  const r=ensureDaily();
  r.items.push({text:val,src:'manual'});
  save();inp.value='';renderDoneList();inp.focus();
}

    </div>
    <details class="rev-fold" ${(mRec.text||mRec.next)?'open':''}><summary><span class="rev-sum-t">✍️ ${(mRec.text||mRec.next)?'编辑本月总结':'写本月总结'}</span><span class="rev-status">${(mRec.text||mRec.next)?'已记录':'未写'}</span></summary><div class="rev-form">
    <label class="fld" style="margin-top:6px">本月总结 / 反思</label>

    <button class="btn sm" style="margin-top:8px" data-action="save-monthly">保存月复盘 +50</button>

    ${weeklyCard}
    ${monthlyCard}

      <div class="muted" style="font-size:11px;margin-bottom:8px">这里自动汇总你每次保存的日复盘（含其它版块同步来的完成项），可逐条删除。</div>
      ${histRows||'<div class="empty">还没有复盘记录</div>'}
    </div>
  </div>`;

/* ============ 存储与清理（设置页 · 需本地数据服务） ============ */
function fmtBytes(n){n=n||0;if(n<1024)return n+' B';if(n<1048576)return Math.round(n/1024)+' KB';return (n/1048576).toFixed(1)+' MB';}
function fallbackCopy(txt){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}catch(e){}}
let storeSt=null;
async function storeRefresh(){
  const box=$('#storeBody');if(!box)return;
  try{
    box.innerHTML='<div class="muted">正在统计占用…</div>';
    const r=await fetch('/api/store',{cache:'no-store'});
    const j=await r.json();
    if(!j||!j.ok){box.innerHTML='<div class="muted">本机数据服务未连接：存储统计需要它来计算。请通过「木案」桌面应用或 <code>node server.js</code> 启动后，回到本页点「刷新」再试。</div>';return;}
    storeSt=j;renderStoreBody();
  }catch(e){box.innerHTML='<div class="muted">本机数据服务未连接：无法统计。请通过桌面应用运行后重试。</div>';}
}
function renderStoreBody(){
  const box=$('#storeBody');if(!box||!storeSt)return;
  const st=storeSt;
  const row=(ico2,t,name,detail,btns)=>`<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-top:1px dashed var(--line)"><span style="flex:none;font-size:16px">${ico2}</span><div style="flex:1;min-width:170px"><div style="font-size:13px;font-weight:600">${name}</div><div class="muted" style="font-size:11.5px;line-height:1.5">${detail}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${btns}</div></div>`;
  const bk=st.backups||{count:0,bytes:0},om=st.orphanMedia||{count:0,bytes:0};
  const cc=(st.cacheBytes||0)+(st.logBytes||0);
  let h='';
  h+=row('🗃️','cache','缓存与运行日志',`${cc?fmtBytes(cc):'0 B'} · 期刊抓取缓存 + 运行日志，删后下次使用自动重建，不影响任何数据`,cc>0?`<button class="btn ghost sm" data-action="store-clean" data-what="cache">清理</button>`:'<span class="muted" style="font-size:11px">无缓存</span>');
  h+=row('📦','backups','自动备份',`共 ${bk.count} 份 · ${fmtBytes(bk.bytes)}。保留最近 3 份，删除更早的旧档（防误删到无法回退）`,bk.count>3?`<button class="btn ghost sm" data-action="store-clean" data-what="backups">清理旧备份</button>`:'<span class="muted" style="font-size:11px">无需清理</span>');
  h+=row('🖼️','orphan','无引用附件',om.count>0?`${om.count} 个 · ${fmtBytes(om.bytes)}。曾在灵感 / 阅读等处上传，但现在没有任何记录引用它（判定很保守，存档里出现过的一律保留）`:'当前没有（所有上传都仍被记录引用）',om.count>0?`<button class="btn ghost sm" data-action="store-clean" data-what="orphan">清理附件</button>`:'');
  const _papers=(state.research&&state.research.papers)||[];
  const _wf=_papers.filter(function(p){return !!p.file;}).length;
  h+=row('📚','lit','科研文献附件','文献库 '+_papers.length+' 篇，其中 '+_wf+' 篇有 PDF 原件。删除文献记录<b>不会</b>删原件；确认不再需要后，用上面的「无引用附件」清理。','<button class="btn ghost sm" data-action="store-open-folder" data-what="media">打开附件目录</button>');
  h+=`<div class="muted" style="font-size:11px;padding-top:8px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.7">主数据（你的全部记录）不在清理范围：请用「数据与同步 → ⬇ 导出 JSON」定期备份。以上每项都会先弹确认再执行，误删可借助自动备份找回。</div>`;
  const paths=st.paths||{};
  if(paths.db||paths.backups||paths.media){

async function storeCleanReq(targets,keep){
  try{
    const r=await fetch('/api/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targets:targets,keep:keep})});
    const j=await r.json();
    if(j&&j.ok){toast('已释放 '+fmtBytes(j.bytes||0)+' 🧹','gold');storeRefresh();}
    else toast('清理失败：'+(j&&j.error||'未知'),'warn');
  }catch(e){toast('清理失败：数据服务未连接','warn');}
}

function delColl(coll,id){
  let arr, rec;
  if(coll==='courses.prep'){arr=state.courses.prep;rec=arr.find(x=>x.id===id);}
  else{arr=coll.split('.').reduce((o,k)=>o[k],state);rec=arr.find(x=>x.id===id);}
  const coin=(coll==='workouts'&&rec)?(rec.coin||0):0;
  let xp=(rec&&rec.xp)||0;
  if(coll==='timeBlocks'&&rec&&rec.done)xp+=2;       // 完成时间块额外 +2
  if(coll==='todos'&&rec&&rec.done)xp+=2;            // 完成任务额外 +2
  if(coll==='studyPlans'&&rec&&rec.steps)xp+=rec.steps.filter(s=>s.done).length*2; // 已勾步骤各 +2
  const parts=[];
  if(coin>0)parts.push('<span class="coin">'+coin+' 木币</span>');
  if(xp>0)parts.push('<span class="xp">'+xp+' 经验</span>');
  let msg=parts.length?('删除这条记录后，创建/完成时所发放的 '+parts.join(' 与 ')+' 将被扣除（不会退还）。确认删除吗？'):'删除后不可恢复，确认删除该记录吗？';
  if(coll==='research.papers')msg+='（PDF 原件会留在附件目录，之后可在「设置 → 存储」用「无引用附件」清理）';
  askConfirm('确认删除',msg,()=>{
    if(coll==='courses.prep'){state.courses.prep=state.courses.prep.filter(x=>x.id!==id);}
    else{const a=coll.split('.').reduce((o,k)=>o[k],state);const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);}
    if(coin)addCoins(-coin,'删除记录撤回木币');
    if(xp)removeXP(xp);
    save();renderTop();renderView();checkAch();
  });
}
function workoutDyn(ty,append,rec){
  const box=$('#m_dyn');if(!box)return;
  if(ty==='strength'){
    const rowHtml=p=>`<div class="row" style="margin-top:6px"><input placeholder="动作" class="w_name" value="${p?esc(p.name):''}"/><input placeholder="组" type="number" class="w_sets" value="${p?p.sets:''}"/><input placeholder="次" type="number" class="w_reps" value="${p?p.reps:''}"/><input placeholder="kg" type="number" class="w_weight" value="${p?p.weight:''}"/></div>`;
    if(append){box.insertAdjacentHTML('beforeend',rowHtml());return;}
    const parts=(rec&&rec.parts)||[null];
    box.innerHTML='<div class="muted" style="font-size:12px">力量：动作 × 组 × 次 × 重量</div>'+parts.map(rowHtml).join('');
  }else{
    const rowHtml=c=>`<div class="row" style="margin-top:6px"><input placeholder="距离km" type="number" class="c_dist" value="${c?c.dist:''}"/><input placeholder="时长min" type="number" class="c_dur" value="${c?c.dur:''}"/><input placeholder="心率" type="number" class="c_hr" value="${c?c.hr:''}"/></div>`;
    if(append){box.insertAdjacentHTML('beforeend',rowHtml());return;}
    box.innerHTML='<div class="muted" style="font-size:12px">有氧：距离 / 时长 / 心率</div>'+rowHtml(rec&&rec.cardio);
  }
}

function parseBib(txt){
  const out=[];const re=/@\w+\{[^,]*,\s*([\s\S]*?)\n\}/g;let m;
  while((m=re.exec(txt))){const body=m[1];const g=k=>{const r=new RegExp(k+'\\s*=\\s*[{"]([^"}]+)');const mm=body.match(r);return mm?mm[1]:'';};out.push({title:g('title'),author:g('author'),year:g('year'),tags:g('keywords')});}
  return out.length?out:[{title:txt.slice(0,60)}];
}

/* ============ timer ============ */
let timer={left:25*60,total:25,id:null,running:false};
function clockStr(s){s=Math.max(0,s|0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function renderClock(){$('#clock')&&($('#clock').textContent=clockStr(timer.left));}
function focusDur(){return Math.max(1,Math.min(180,state.settings.focusDuration||25));}
function timerCtrl(c,min){
  if(c==='set'){let d=min==='custom'?((+$('#focusCustom').value)||focusDur()):(+min||focusDur());d=Math.max(1,Math.min(180,d));state.settings.focusDuration=d;save();clearInterval(timer.id);timer={left:d*60,total:d,id:null,running:false};renderClock();renderView();return;}
  if(c==='reset'){clearInterval(timer.id);const d=focusDur();timer={left:d*60,total:d,id:null,running:false};renderClock();return;}
  if(c==='start'){if(timer.running)return;timer.running=true;const mins=timer.total||focusDur();notify('番茄钟已开始',mins+' 分钟专注，结束后会提醒你 🍅',{duration:6000});timer.id=setInterval(()=>{timer.left--;renderClock();if(timer.left<=0){clearInterval(timer.id);timer.running=false;addCoins(mins,'专注');addXP(Math.round(mins*0.8));markActive();checkAch();save();renderTop();speak(DIALOGS.focusDone);notify('专注完成 🎉','本轮专注 '+mins+' 分钟，木币 +'+mins+' 🪙',{duration:10000});}},1000);}
  if(c==='pause'){clearInterval(timer.id);timer.running=false;}
}

function toggleNotify(){
  const on=!state.settings.notifications;
  if(on){
    try{if('Notification'in window&&Notification.permission!=='granted'){Notification.requestPermission().then(()=>{});}}catch(e){}
    state.settings.notifications=true;save();renderView();
    notify('系统通知已开启','提醒会以弹窗出现在右下角，含木案图标与内容，可点「我知道了」关闭。',{duration:6000});
  }else{
    state.settings.notifications=false;save();renderView();toast('系统通知已关闭');
  }
}

const reminded={};            // 本次会话已提醒的 key，避免重复弹窗

function bumpActivity(){lastActivity=Date.now();}
function dueDt(t){if(!t.due)return null;const base=t.due+(t.dueTime?('T'+t.dueTime):'T21:00');const d=new Date(base);return isNaN(d.getTime())?null:d;}
function fmtLeft(ms){if(ms<=0)return '已到时间';const m=Math.round(ms/60000);if(m<60)return m+' 分钟';const h=Math.floor(m/60),mm=m%60;return h+' 小时'+(mm?(' '+mm+' 分'):'');}
function checkReminders(){
  if(!state.settings.notifications)return;
  const lead=(state.settings.remindLead||15)*60000, now=Date.now();
  // 1) 待办到期（含可选提醒时间）
  state.todos.forEach(t=>{
    if(t.done)return;const dt=dueDt(t);if(!dt)return;
    const key=t.due+'@'+(t.dueTime||'');
    if(t._rk!==key){t._rk=key;t._rd=0;}
    const diff=dt-now;
    if(diff<=lead&&diff>-5*60000&&!t._rd){t._rd=1;save();notify('待办即将到期',(t.title||'待办')+(t.cat?('（'+t.cat+'）'):'')+'，'+(diff>0?('还剩 '+fmtLeft(diff)):'已到截止时间'),{countdown:(diff>0?('还剩 '+fmtLeft(diff)):'已到时间'),duration:12000});}
  });
  // 2) 课程开始（按节次时间）
  const ci=(new Date().getDay()+6)%7;
  state.courses.periods.forEach((tm,ri)=>{
    if(!tm||!/^\d{1,2}:\d{2}$/.test(tm))return;
    const c=state.courses.grid[ri+'-'+ci];if(!c||!c.title)return;
    const dt=new Date(),p=tm.split(':');dt.setHours(+p[0],+p[1],0,0);
    const diff=dt-now,key=ri+'-'+ci+'@'+todayStr();
    if(diff<=lead&&diff>-3*60000&&!reminded[key]){reminded[key]=1;notify('课程即将开始',(c.title)+(c.room?(' @'+c.room):'')+'，'+(diff>0?('还剩 '+fmtLeft(diff)):'已开始'),{countdown:(diff>0?('还剩 '+fmtLeft(diff)):'已开始'),duration:12000});}
  });
  // 3) 久坐
  const sit=(state.settings.sitThreshold||50)*60000;
  if(now-lastActivity>=sit){lastActivity=now;notify('久坐提醒','你已经坐了很久啦，起身活动一下、喝口水吧 🌿',{duration:10000});}
}

/* ============ theme ============ */
async function bgUpload(inp){
  const f=inp&&inp.files&&inp.files[0]; if(!f)return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast('仅支持 jpg / png / webp','warn');return;}
  if(f.size>2.5*1024*1024){toast('图片不能超过 2.5MB','warn');return;}
  let dataUrl='';
  try{dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f);});}catch(e){toast('读取图片失败','warn');return;}
  const bg=state.settings.bg;
  let img=dataUrl;
  if(USE_API){
    try{
      const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,type:f.type,data:String(dataUrl).split(',')[1]||''})});
      const j=await r.json(); if(j&&j.ok&&j.path)img=j.path;
    }catch(e){}
  }
  bg.img=img; bg.mode='custom';
  applyTheme(); save(); renderView();
  if(!USE_API&&String(dataUrl).length>3400000)toast('图片较大：手机端存本机容量有限，刷新后可能丢失，建议换 2MB 内的图','warn');
  refreshSettingsModal();
  toast('背景图片已应用 🖼️','gold');
}
function applyTheme(){
  document.documentElement.dataset.theme=state.settings.dark?'dark':'light';
  document.documentElement.dataset.color=state.settings.color;
  document.documentElement.dataset.density=state.settings.density;
  const bg=(state.settings&&state.settings.bg)||{};
  let mode=bg.mode==='custom'&&!bg.img?'theme':(bg.mode||'theme');   // custom 无图时回退主题
  document.documentElement.dataset.bg=mode;
  document.body.classList.toggle('bgsoft', mode==='custom'&&!!bg.soft);
  try{ if(bg.img){document.body.style.setProperty('--bg-custom','url("'+bg.img.replace(/"/g,'%22')+'")');}else{document.body.style.removeProperty('--bg-custom');} }catch(e){}
}

/* ============ init ============ */
async function init(){
  USE_API=(location.protocol==='http:'||location.protocol==='https:')&&await detectLocalServer();
  state=await loadData();
  cloudLoadSess();
  cloudSeenLoad();
  applyTheme();
  if(typeof localStorage!=='undefined' && localStorage.getItem('muan.sideCollapsed')==='1'){const s=document.querySelector('.sidebar');if(s)s.classList.add('collapsed');}
  timer.left=focusDur()*60;timer.total=focusDur();
    renderAll();renderClock();checkAch();
  // 云同步启动：有登录态就把云端较新数据拉回来；再开启定时轮询与回前台拉取
  cloudBooted=true;
  if(cloudSession){cloudDirty=false;const _cp=await cloudPull().catch(()=>null);if(_cp&&_cp.ok&&!_cp.same&&!_cp.empty)toast('已从云端恢复最新数据');}
  if(!USE_API&&'serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPromptEv=e;});
  window.addEventListener('appinstalled',()=>{installPromptEv=null;});
  setInterval(()=>{if(document.visibilityState==='visible'&&cloudSession&&cloudAuto())cloudPull().catch(()=>{});},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudSession&&cloudAuto()&&!cloudDirty)cloudPull().catch(()=>{});});
  $('#checkinBtn').addEventListener('click',doCheckin);
  // delegated events
  document.addEventListener('click',e=>{
    const fBtn=e.target.closest('[data-form]');
    if(fBtn){e.preventDefault();handleForm(fBtn);return;}
    const el=e.target.closest('[data-action]');
    if(el){const a=el.dataset.action;if(a.startsWith('store-')||a.startsWith('bg-')||a.startsWith('ai-')||a.startsWith('so-')||a.startsWith('cloud-')||a==='install-app'||a==='nav'||a==='nav-more'||a==='toggle-theme'||a==='set-color'||a==='set-density'||a==='course-mode'||a==='news-tab'||a==='toggle-notify'||a==='toggle-sync'||a==='sync-now'||a==='reward-draw'||a==='speak-brief'||a==='checkin-btn'||a==='close-modal'||a==='edit'||a.startsWith('add-')||a.startsWith('del')||a.startsWith('block-')||a.startsWith('todo-')||a.startsWith('step-')||a.startsWith('research-')||a.startsWith('lit-')||a.startsWith('res-ai')||a.startsWith('imp-')||a.startsWith('pdf-')||a.startsWith('jnl-')||a.startsWith('journal-')||a.startsWith('cn-')||a==='follow-journal'||a==='unfollow-journal'||a==='refresh-journals'||a==='save-as-paper'||a==='incubate-idea'||a.startsWith('course-')||a.startsWith('pay-')||a.startsWith('move')||a.startsWith('open-')||a.startsWith('reward-')||a.startsWith('save-')||a.startsWith('hw-')||a.startsWith('credit-')||a==='wk-add-row'||a==='clear-demo'||a==='export'||a==='import'||a.startsWith('import')||a==='timer'||a==='zotero-import'||a.startsWith('ach-')||a.startsWith('edit-')||a.startsWith('asset-')||a.startsWith('confirm-')||a==='test-notify'||a==='reset-progress'||a==='news-refresh'||a==='news-save'||a.startsWith('news')||a.startsWith('ms-')||a.startsWith('insp')||a.startsWith('rd')||a.startsWith('review-')||a.startsWith('done-')||a==='toggle-side'||a.startsWith('search')){handleAction(a,el);}}
  });
  document.addEventListener('change',e=>{if(e.target.id==='import_file'){importFileRead(e.target);}
  if(e.target.dataset&&e.target.dataset.fkey){const f=e.target.dataset.fkey;const v=e.target.value;const J=state.research.journals;if(f==='cnjournal'||f==='cnyear'){J.cnMetaFilter=J.cnMetaFilter||{journal:'',year:''};J.cnMetaFilter[f]=v;save();renderView();return;}if(f==='recent'){J.filters=J.filters||{};J.filters[f]=v;save();renderView();return;}J.filters=J.filters||{};J.filters[f]=v;save();renderView();return;}if(e.target.id==='m_type')workoutDyn(e.target.value);if(e.target.id==='m_happy'){const r=50+(Math.max(1,Math.min(5,(+$('#m_happy').value)||3))-1)*25;const pr=$('#m_reward');if(pr)pr.textContent='+'+r+' 木币';}if(e.target.classList.contains('ctime')){const i=+e.target.dataset.i;if(state.courses.periods[i]!==undefined){state.courses.periods[i]=e.target.value;save();renderView();}}if(e.target.id==='set_sit'){state.settings.sitThreshold=Math.max(1,Math.min(240,(+$('#set_sit').value)||50));save();toast('已保存久坐阈值');}if(e.target.id==='set_lead'){state.settings.remindLead=Math.max(1,Math.min(120,(+$('#set_lead').value)||15));save();toast('已保存提前提醒');}if(e.target.id==='insp_img'||e.target.id==='insp_vid'){inspUpload(e.target);}if(e.target.id==='bg_file'){bgUpload(e.target);}
  if(e.target.id==='rd_img'||e.target.id==='rd_vid'){rdUpload(e.target);}
  if(e.target.id==='rd_cover'){rdCoverUpload(e.target);}});
  // 全局搜索
  const gs=document.getElementById('globalSearch');
  if(gs){gs.addEventListener('input',e=>doSearch(e.target.value));gs.addEventListener('keydown',e=>{if(e.key==='Escape'){const r=document.getElementById('searchResults');if(r)r.classList.remove('open');gs.blur();}});}
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap')){const r=document.getElementById('searchResults');if(r)r.classList.remove('open');}});
  // 复盘：回车添加完成项 + 失焦保存行内编辑
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='r_done_input'){e.preventDefault();addManualDone();}});
  document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('done-text'))t.dataset.orig=t.textContent;});
  document.addEventListener('keydown',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('done-text')){if(e.key==='Enter'){e.preventDefault();t.blur();}else if(e.key==='Escape'){if(t.dataset.orig!==undefined)t.textContent=t.dataset.orig;t.blur();}}});
  document.addEventListener('blur',e=>{const el=e.target.closest('.done-text');if(!el)return;const r=ensureDaily();const val=el.textContent.trim();const key=el.dataset.key;if(key){let it=(r.items||[]).find(x=>x.src==='auto'&&x.key===key);if(!it){it={text:val,src:'auto',key};r.items.push(it);}else it.text=val;}else{const mi=+el.dataset.mi;if(r.items&&r.items[mi])r.items[mi].text=val;}save();},true);
  // 活动监听：重置久坐计时
  document.addEventListener('click',bumpActivity);
  document.addEventListener('keydown',bumpActivity);
  // 文本框随内容自动增高
  document.addEventListener('input',e=>{const t=e.target;if(t&&t.tagName==='TEXTAREA')autoGrow(t);});
  // 对话助手：回车发送、Shift+Enter 换行；表单提交也发送
  document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='aiText'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend(e);}});
  document.addEventListener('submit',e=>{if(e.target&&e.target.id==='aiForm'){e.preventDefault();aiSend(e);}});
  // 复盘折叠条展开时，让里面的文本框恢复自动增高
  document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('rev-fold')){d.querySelectorAll('textarea').forEach(t=>{try{autoGrow(t);}catch(x){}});}});
  const _afi=document.getElementById('aiFileInput');
  if(_afi)_afi.addEventListener('change',function(){aiAddFiles(_afi.files);});
  setInterval(checkReminders,20000);
  checkReminders();
}
init();
})();
</script>
