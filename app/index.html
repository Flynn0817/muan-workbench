<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-color="green">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>木案 · 个人工作台</title>
<meta name="theme-color" content="#2d5a3d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="木案" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23f5f1e8'/%3E%3Crect x='110' y='300' width='292' height='30' rx='15' fill='%232f4f3e'/%3E%3Crect x='140' y='330' width='22' height='98' rx='11' fill='%232f4f3e'/%3E%3Crect x='350' y='330' width='22' height='98' rx='11' fill='%232f4f3e'/%3E%3Crect x='246' y='205' width='14' height='98' rx='7' fill='%232f4f3e'/%3E%3Cellipse cx='220' cy='238' rx='36' ry='19' fill='%236b8f71' transform='rotate(-34 220 238)'/%3E%3Cellipse cx='286' cy='238' rx='36' ry='19' fill='%236b8f71' transform='rotate(34 286 238)'/%3E%3Ccircle cx='253' cy='204' r='13' fill='%236b8f71'/%3E%3Ccircle cx='382' cy='166' r='30' fill='%23c9a227'/%3E%3C/svg%3E" />
<style>
  :root{
    --paper:#f3efe6; --surface:#fbf8f1; --surface-2:#e9e5d8; --page:#e9ece2;
    --accent:#2d5a3d; --accent-soft:#5d8470; --accent-deep:#1a3a2f; --accent-dark:#2d5a3d; --gold:#c9a96e;
    --ink:#1f2e25; --ink-soft:#5a6b62; --line:color-mix(in srgb, var(--accent-dark) 16%, transparent);
    --red:#b35654; --red-soft:#f1e0dd; --green:#2d8a55; --warn:#c98a2b;
    --radius:18px; --radius-sm:11px; --shadow:0 6px 24px color-mix(in srgb, var(--accent-dark) 10%, transparent);
    --moss:#9bbf86;
    --gap:12px; --pad:14px;
    /* 森林专色 */
    --mist:#e8f0e4;
    --sunbeam:rgba(255,250,235,.35);
    --pineneedle:#0f2a1d;
    /* 侧栏深底上的高亮主色（导航选中/指示条用，随主题色） */
    --navhl:#9cc1a3;
  }
  [data-color="blue"]{--accent:#2f5a6e;--accent-soft:#6b95a8;--accent-deep:#16303c;--accent-dark:#2f5a6e;--gold:#c9a96e;--mist:#e0e9ed;--page:#e6eaee;--navhl:#8fb9d4;--moss:#9cc4cf;}
  [data-color="ochre"]{--accent:#7a4a2b;--accent-soft:#b08a5e;--accent-deep:#3a2416;--accent-dark:#7a4a2b;--gold:#c9a96e;--mist:#f0e5db;--page:#efe9e1;--navhl:#d9b48a;--moss:#c9b37f;}
  [data-color="violet"]{--accent:#4a3a6b;--accent-soft:#8a7ab0;--accent-deep:#241a38;--accent-dark:#4a3a6b;--gold:#c9a96e;--mist:#eae4f0;--page:#ebe7ef;--navhl:#b3a0d6;--moss:#b1a2cc;}
  [data-theme="dark"]{
    --paper:#0d1612; --surface:#15201a; --surface-2:#1f2c24; --page:#0d1612;
    --accent:#7fae93; --accent-soft:#9cc1a3; --accent-deep:#a8d4b8; --accent-dark:#2d5a3d; --gold:#d8b24a;
    --ink:#e4e8e0; --ink-soft:#9aa89e; --line:color-mix(in srgb, var(--accent) 18%, transparent);
    --red:#e06455; --red-soft:#3a2826; --green:#5fcf86; --warn:#e0a85a;
    --mist:#1a2a20; --sunbeam:rgba(255,250,235,.12); --pineneedle:#06130a;
    --shadow:0 6px 22px rgba(0,0,0,.45);
  }
  [data-theme="dark"][data-color="blue"]{
    --paper:#0b1419; --surface:#122029; --surface-2:#1c2d37; --page:#0b1419;
    --accent:#9cc4d8; --accent-soft:#b7d7e6; --accent-deep:#cfe6f0; --accent-dark:#28424e; --gold:#d8b24a;
    --ink:#e3eaee; --ink-soft:#9fb2bc; --line:rgba(156,196,216,.20);
    --red:#e06455; --red-soft:#3a2826; --green:#5fcf86; --warn:#e0a85a;
    --mist:#17252e; --sunbeam:rgba(232,244,250,.10); --pineneedle:#06131c;
  }
  [data-theme="dark"][data-color="ochre"]{
    --paper:#181009; --surface:#221812; --surface-2:#2f221a; --page:#181009;
    --accent:#d8a678; --accent-soft:#e6c09a; --accent-deep:#efd8bc; --accent-dark:#54371f; --gold:#e6c079;
    --ink:#efe7dd; --ink-soft:#b5a79a; --line:rgba(216,166,120,.22);
    --red:#e06455; --red-soft:#3a2826; --green:#8fce7f; --warn:#e8b25f;
    --mist:#291c12; --sunbeam:rgba(250,240,225,.10); --pineneedle:#160c05;
  }
  [data-theme="dark"][data-color="violet"]{
    --paper:#131019; --surface:#1c1726; --surface-2:#282038; --page:#131019;
    --accent:#b9a6da; --accent-soft:#cfc0e8; --accent-deep:#ded2f2; --accent-dark:#382c52; --gold:#dcc78a;
    --ink:#eae6f0; --ink-soft:#a99fb8; --line:rgba(185,166,218,.22);
    --red:#e06455; --red-soft:#3a2826; --green:#7fd6a0; --warn:#e0a85a;
    --mist:#241c30; --sunbeam:rgba(242,238,252,.10); --pineneedle:#0f0a16;
  }
  [data-density="compact"]{--gap:10px;--pad:10px;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--page);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:transparent;
    color:var(--ink); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    position:relative;
    min-height:100vh;
  }
  /* 全局背景：模糊森林底图 + 浅色雾遮罩（详情页磨砂玻璃的底层） */
  body::before{
    content:"";
    position:fixed; inset:-40px;
    background:url('data/forest-hero.jpg') center 32%/cover no-repeat;
    filter:blur(22px) saturate(1.06) brightness(1.05);
    z-index:0;
    opacity:.52;
    pointer-events:none;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 70% 30% at 50% -6%, rgba(232,240,228,.55), transparent 70%),
      linear-gradient(180deg, rgba(248,245,237,.82) 0%, rgba(235,241,233,.74) 45%, rgba(226,235,224,.80) 100%);
    z-index:0;
    pointer-events:none;
  }
  .app{display:flex; min-height:100vh; position:relative; z-index:1;}
  /* Sidebar */
  .sidebar{
    width:17%; min-width:176px; max-width:240px;
    background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:10px 8px; gap:2px;
    position:sticky; top:0; height:100vh; overflow:hidden;
    transition:width .22s cubic-bezier(.22,.61,.36,1), min-width .22s ease, max-width .22s ease, padding .22s ease;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 6px 12px; position:relative;}
  .side-toggle{
    margin-left:auto; width:28px;height:28px;flex:none;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink-soft);border-radius:8px;cursor:pointer;
    display:grid;place-items:center;transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .side-toggle:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .side-toggle svg{width:16px;height:16px;transition:transform .22s cubic-bezier(.22,.61,.36,1);}
  .sidebar.collapsed .side-toggle{margin-left:0;}
  .sidebar.collapsed .side-toggle svg{transform:rotate(180deg);}
  .brand img{width:34px;height:34px;border-radius:9px;}
  .brand b{font-size:17px; letter-spacing:2px; color:var(--accent);}
  .nav-item{
    position:relative; display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:var(--radius-sm);
    color:var(--ink-soft); cursor:pointer; font-size:14px; user-select:none;
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .nav-item svg{width:19px;height:19px;flex:none;transition:transform .2s ease;}
  .nav-item::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%) scaleY(.15);
    width:3px; height:64%; border-radius:0 4px 4px 0; background:var(--accent);
    opacity:0; transition:transform .22s cubic-bezier(.22,.61,.36,1), opacity .18s ease;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--ink); transform:translateX(3px);}
  .nav-item:hover::before{transform:translateY(-50%) scaleY(1); opacity:1;}
  .nav-item:hover svg{transform:scale(1.08);}
  .nav-item.active{background:var(--accent); color:#fff; box-shadow:var(--shadow); transform:none;}
  .nav-item.active::before{background:#fff; transform:translateY(-50%) scaleY(1); opacity:1;}
  .nav-item.active svg{transform:none;}
  .nav-item .badge{margin-left:auto; font-size:11px; background:var(--gold); color:#3a2e00; border-radius:20px; padding:1px 7px; font-weight:700;}
  .side-foot{margin-top:auto; padding:8px 8px 2px; font-size:10.5px; color:var(--ink-soft); line-height:1.4;}
  #nav{flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
  #nav::-webkit-scrollbar{display:none;}
  /* Profile card in sidebar */
  .profile-card{margin:4px 2px 7px;padding:8px 10px;background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--radius-sm);position:relative;}
  .profile-card .p-name{font-size:14px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;}
  .profile-card .p-name .p-edit{width:16px;height:16px;border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;border-radius:4px;opacity:0;transition:.15s;}
  .profile-card:hover .p-edit{opacity:1;}
  .profile-card .p-edit:hover{background:var(--line);color:var(--ink);}
  .profile-card .p-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .profile-card .p-row .p-label{min-width:28px;color:var(--accent-soft);font-weight:600;}
  .profile-card .p-motto{margin-top:4px;font-size:10.5px;color:var(--ink-soft);font-style:italic;border-left:2.5px solid var(--accent);padding-left:8px;line-height:1.4;display:none;}
  .profile-card .p-motto.show{display:block;}
  /* Main */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:20;
  }
  .stat{display:flex; align-items:center; gap:7px; font-size:14px;}
  .stat .ico{width:18px;height:18px;color:var(--gold);}
  .stat b{font-variant-numeric:tabular-nums;}
  .level-badge{
    width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:15px; position:relative; flex:none;
  }
  .xp-wrap{flex:1; max-width:200px;}
  .xp-bar{height:7px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));border-radius:6px;transition:width .4s;}
  .top-actions{margin-left:auto; display:flex; gap:8px;}
  .icon-btn{width:36px;height:36px;border:none;border-radius:10px;background:var(--surface-2);color:var(--ink);cursor:pointer;display:grid;place-items:center;}
  .icon-btn:hover{background:var(--line);}
  .detail{padding:14px; max-width:1100px; width:100%; margin:0 auto;}
  /* Cards */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:var(--pad); box-shadow:var(--shadow); margin-bottom:var(--gap);}
  .card h3{margin:0 0 8px; font-size:14px; display:flex; align-items:center; gap:8px;}
  .card h3 .sub{font-weight:400; font-size:12px; color:var(--ink-soft); margin-left:auto;}
  .grid{display:grid; gap:var(--gap);}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr;}}
  /* 概览布局定死：卡片高度固定；溢出内容改为内部下滑，并以渐变遮罩淡出 */
  .ov-root .card{ display:flex; flex-direction:column; overflow:hidden; }
  .ov-root .card > h3{ flex:0 0 auto; }
  .ov-root .g3 .card{ max-height:252px; }
  .ov-root .g2 .card{ max-height:340px; }
  .ov-body{ flex:1 1 auto; min-height:0; overflow-y:auto; padding-right:3px; }
  /* 下滑遮罩：顶端/底端渐变透明，提示还有内容 */
  .ov-body.fade-top{ -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px); mask-image:linear-gradient(to bottom,transparent 0,#000 16px); }
  .ov-body.fade-bottom{ -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent 100%); mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent 100%); }
  .ov-body.fade-both{ -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%); mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%); }
  /* 复盘：2×2 网格，左列=日简复+复盘历史，右列=周深复+月复盘，复盘历史与月复盘持平 */
  .review-grid{ align-items:stretch; }
  /* Buttons & inputs */
  button.btn{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  button.btn:hover{filter:brightness(1.06);}
  button.btn.ghost{background:var(--surface-2); color:var(--ink);}
  button.btn.ghost:hover{background:var(--line);}
  button.btn.gold{background:var(--gold); color:#3a2e00;}
  button.btn.sm{padding:6px 11px; font-size:13px;}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:8px 10px; width:100%;}
  /* 文本框随内容自动增高（不再固定行数、不再被截断） */
  textarea{resize:none; overflow:hidden; min-height:40px; line-height:1.5; vertical-align:top; field-sizing:content;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
  label.fld{display:block; font-size:12.5px; color:var(--ink-soft); margin:9px 0 4px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row>*{flex:1; min-width:0;}
  /* Lists */
  .item{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:7px;}
  .item .body{flex:1; min-width:0;}
  .item .title{font-size:14px; font-weight:600;}
  .item .meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .item.done .title{text-decoration:line-through; color:var(--ink-soft);}
  .todo-groups{display:flex;flex-direction:column;gap:14px;}
  .todo-group{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);}
  .todo-group-title,.todo-subtitle{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:0;margin:0 0 10px;font-family:inherit;cursor:pointer;text-align:left;border-radius:8px;}
  .todo-group-title{font-size:14px;font-weight:700;}
  .todo-subtitle{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;padding-left:6px;border-left:3px solid var(--accent);}
  .todo-group-title:hover,.todo-subtitle:hover{opacity:.72;}
  .todo-group.collapsed{padding-bottom:8px;background:var(--surface);}
  .todo-group.collapsed .todo-group-title{margin-bottom:0;}
  .todo-subgroup.collapsed .todo-subtitle{opacity:.62;}
  .chev{flex:none;display:inline-block;width:10px;font-size:10px;line-height:1;color:var(--ink-soft);transition:transform .18s;}
  .collapsed>.chev,.todo-subtitle.collapsed .chev{transform:rotate(-90deg);}
  .todo-group-title .count,.todo-subtitle .count{flex:none;font-size:11.5px;font-weight:500;background:var(--surface);padding:1px 8px;border-radius:999px;color:var(--ink-soft);}
  .todo-subgroup{margin-bottom:12px;}
  .todo-subgroup:last-child{margin-bottom:0;}
  .todo-subgroup .item{margin-left:4px;}
  .todo-overview{display:flex;flex-direction:column;gap:8px;padding:10px 12px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
  .ov-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ov-lab{flex:none;width:44px;font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .ov-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
  .ov-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-family:inherit;cursor:pointer;color:var(--ink);transition:box-shadow .15s,transform .12s;}
  .ov-chip:hover{filter:brightness(.96);}
  .ov-chip:active{transform:scale(.96);}
  .ov-chip.on{box-shadow:0 0 0 2px currentColor inset;background:var(--surface);}
  .ov-chip b{font-weight:700;font-variant-numeric:tabular-nums;}
  .ov-lead{font-size:12.5px;color:var(--ink);line-height:1.6;}
  .ov-lead b{font-variant-numeric:tabular-nums;}
  .ov-alert{font-size:12.5px;color:var(--red);background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.22);border-radius:10px;padding:6px 10px;line-height:1.5;}
  .ov-more{font-size:11px;color:var(--ink-soft);text-align:center;padding:3px 0 1px;}
  .done-group{background:var(--surface);border-style:dashed;opacity:.94;}
  .done-group .item{background:var(--surface-2);}
  .ov-bar{flex:1;min-width:80px;height:7px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .ov-bar i{display:block;height:100%;background:var(--accent-soft);border-radius:6px;}
  .ov-num{flex:none;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .ov-acts{display:flex;gap:14px;justify-content:flex-end;border-top:1px dashed var(--line);padding-top:7px;}
  .tag{display:inline-block; font-size:11px; padding:1px 8px; border-radius:20px; background:var(--surface-2); color:var(--ink-soft); margin-right:5px;}
  .tag.green{background:rgba(39,174,96,.15); color:var(--green);}
  .tag.gold{background:rgba(201,162,39,.18); color:var(--gold);}
  .tag.red{background:rgba(192,57,43,.14); color:var(--red);}
  .tag.warn{background:rgba(230,160,40,.16); color:#a06a00;}
  .tag.accent{background:rgba(90,130,110,.15); color:var(--accent);}
  .tag.blue{background:rgba(52,120,220,.15); color:#3a78d8;}
  .tag.blue:hover{background:rgba(52,120,220,.28);}
  .cat-chip{display:inline-block; font-size:11.5px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); cursor:pointer; margin:0 5px 5px 0; transition:.15s; font-family:inherit; user-select:none;}
  .cat-chip:hover{filter:brightness(.97);}
  .cat-chip.on{box-shadow:0 0 0 2px currentColor inset;}
  .course-dim{opacity:.22; filter:grayscale(.4);}
  .mini-btn{border:none;background:none;cursor:pointer;color:var(--ink-soft);padding:5px;border-radius:7px;}
  .mini-btn:hover{background:var(--surface-2);color:var(--accent);}
  .progress{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:7px;}
  .progress i{display:block;height:100%;background:var(--accent-soft);border-radius:6px;}
  .empty{color:var(--ink-soft); font-size:13px; text-align:center; padding:18px 0;}
  .empty.add-cta{cursor:pointer; border:1px dashed var(--line); border-radius:12px; background:var(--surface-2); color:var(--accent); font-weight:600; transition:.15s; width:100%; font-family:inherit;}
  .empty.add-cta:hover{background:var(--line);}
  /* Timer */
  .timer{display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0;}
  .timer .clock{font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:2px; color:var(--accent);}
  .timer .chip{font-size:12px; padding:4px 11px; border:1px solid var(--line); background:var(--surface); border-radius:999px; cursor:pointer; color:var(--ink); transition:.15s; font-family:inherit;}
  .timer .chip:hover{border-color:var(--accent);}
  .timer .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}

/* 设置栏目（横条列表）与「更多」页条目通用行样式 */

.notif .n-x:hover{background:var(--surface-2);color:var(--ink);}
@keyframes notifIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
/* ===== 导航分组 ===== */
.nav-group{margin-bottom:5px;}
.nav-group-label{font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px;padding:2px 10px;margin-top:1px;transition:opacity .15s ease;}
/* 侧栏折叠态 */
.sidebar.collapsed{width:60px;min-width:60px;max-width:60px;padding:10px 6px;}
.sidebar.collapsed .brand{justify-content:center;padding:4px 0 12px;}
.sidebar.collapsed .brand b,
.sidebar.collapsed .nav-group-label,
.sidebar.collapsed .profile-card,
.sidebar.collapsed .side-foot{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px 0;gap:0;}
.sidebar.collapsed .nav-item span{display:none;}
.sidebar.collapsed .nav-item .badge{position:absolute;top:2px;right:6px;margin:0;padding:0 5px;}
.sidebar.collapsed .nav-group{margin-bottom:6px;}
/* ===== 顶部搜索 ===== */
.search-wrap{position:relative;flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink-soft);}
.search-wrap svg{width:16px;height:16px;flex:none;opacity:.75;transition:opacity .15s ease;}
.search-input{border:none;background:transparent;outline:none;flex:1;font-size:13px;color:var(--ink);}
.search-input::placeholder{color:var(--ink-soft);}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:50;display:none;}
.search-results.open{display:block;}
.search-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--surface-2);}
.search-item .si-ico{width:16px;height:16px;color:var(--accent);flex:none;}
.search-item .si-main{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;}
.search-item .si-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.search-item .si-sub{font-size:11px;color:var(--ink-soft);margin-left:auto;flex:none;background:var(--surface-2);border-radius:10px;padding:1px 8px;}
.search-empty{padding:12px;color:var(--ink-soft);font-size:12px;text-align:center;}
/* ===== 科研工作台标签页 ===== */
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.rtab{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);cursor:pointer;font-size:13px;}
.rtab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.rtab:hover{color:var(--ink);}
/* 里程碑 / 红绿灯 */
.ms-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;}
.ms-dot.green{background:var(--green);} .ms-dot.amber{background:var(--warn);} .ms-dot.red{background:var(--red);}
.tl-bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px;}
.tl-bar>i{display:block;height:100%;background:var(--accent);}
.pipeline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.pipeline .pstep{flex:1;min-width:90px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--ink-soft);position:relative;}
.pipeline .pstep.done{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);}
.pipeline .pstep.cur{border-color:var(--gold);color:var(--ink);box-shadow:0 0 0 2px var(--gold) inset;}
/* 评分星 */
.stars{color:var(--gold);letter-spacing:1px;}
/* ===== 期刊雷达 ===== */
.jnl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px;}
.jnl-card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;transition:.15s;}
.jnl-card:hover{border-color:var(--accent-soft);box-shadow:var(--shadow-sm);}
.jnl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.jnl-name{font-weight:700;font-size:14px;color:var(--ink);}
.jnl-level{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;}
.jnl-meta{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.jnl-new{font-size:11px;color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin-top:2px;}
.jnl-card .mini-btn{position:absolute;top:8px;right:8px;}
/* 期刊库列表 */
.jnl-lib-list{margin-top:8px;}
.jnl-lib-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.jnl-lib-item:last-child{border-bottom:none;}
.jnl-lib-info{flex:1;min-width:0;}
.jnl-lib-info .jnl-name{font-size:13px;}
.jnl-level-sm{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--gold);color:#3a2e00;font-weight:600;}
/* ===== 灵感素材 ===== */
.insp-quick{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;}
.insp-quick textarea{width:100%;min-height:54px;resize:vertical;}
.insp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
.insp-row .grow{flex:1;min-width:120px;}
.insp-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
.insp-chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;color:var(--ink-soft);}
.insp-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.insp-chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
.media-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.media-thumbs img,.media-thumbs video{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#000;}
.media-thumbs .mfile{padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;display:flex;align-items:center;gap:6px;background:var(--surface);}
.insp-meta{font-size:12px;color:var(--ink-soft);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;}
.cat-color{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:5px;}

/* ===== 阅读记录 ===== */
.rd-stats{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.rd-stat{display:flex;flex-direction:column;align-items:center;min-width:46px;}
.rd-stat b{font-size:22px;color:var(--accent);line-height:1;}
.rd-stat span{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-top:12px;padding:16px 12px 20px;border-radius:14px;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:inset 0 -12px 0 -7px rgba(122,74,43,.28);border:1px solid var(--line);}
.book-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;transition:.15s;}
.book-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent-soft);}
.rd-cover{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--surface-2);}
.rd-cover-img{width:100%;height:100%;object-fit:cover;display:block;}
.rd-cover-gen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.rd-cover-gen span{font-size:36px;font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 2px 6px rgba(0,0,0,.35);}
.rd-status{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.9);color:var(--ink);font-weight:700;border:1px solid var(--line);}
.rd-status-reading{background:var(--accent-soft);color:#fff;border-color:transparent;}
.rd-status-read{background:var(--gold);color:#3a2e00;border-color:transparent;}
.rd-status-unread{background:var(--surface-2);color:var(--ink-soft);}
.rd-book-title{font-weight:700;font-size:13px;color:var(--ink);line-height:1.3;max-height:2.6em;overflow:hidden;}
.rd-book-author{font-size:11px;color:var(--ink-soft);}
.rd-progress{display:flex;align-items:center;gap:6px;margin-top:2px;}
.rd-progress-bar{flex:1;height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.rd-progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));border-radius:6px;transition:width .4s;}
.rd-progress-txt{font-size:10px;color:var(--ink-soft);white-space:nowrap;}
.rd-book-actions{display:flex;justify-content:flex-end;gap:4px;}
.rd-cover-prev{width:96px;height:128px;border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;position:relative;}
.rd-cover-prev img{width:100%;height:100%;object-fit:cover;}
.rd-cover-prev .mini-btn{position:absolute;top:2px;right:2px;background:rgba(255,255,255,.85);}

/* ===== 时事热点 · 卡片信息流（仿图1爆款风格） ===== */
.news-feed{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
.news-card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;transition:.18s;cursor:default;}
.news-card:hover{box-shadow:var(--shadow);border-color:var(--accent-soft);transform:translateY(-1px);}
.news-card-thumb{flex:none;width:130px;height:88px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--moss));display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.news-card-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.news-card-thumb .thumb-icon{font-size:28px;opacity:.45;}
.news-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.news-card-title{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.news-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);}
.news-card-source{padding:2px 8px;border-radius:6px;background:var(--surface-2);font-weight:500;color:var(--ink-soft);white-space:nowrap;}
.news-card-hot{color:var(--red);font-weight:600;white-space:nowrap;}
.news-card-rank{color:var(--accent);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11.5px;}
.news-card-title a{color:inherit;text-decoration:none;display:block;}
.news-card-title a:hover{color:var(--accent);}
.news-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px;}
.news-card-tag{padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.news-card-actions{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);}
.news-save-btn{margin-left:auto;padding:5px 14px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:12px;cursor:pointer;transition:.15s;}
.news-save-btn:hover{background:var(--gold);color:#fff;}
.news-saved-badge{margin-left:auto;padding:5px 14px;border-radius:20px;background:var(--gold);color:#fff;font-size:11.5px;font-weight:600;}

/* 新闻筛选标签栏 */
.news-filter-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 12px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line);}
.news-filter-chip{padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;color:var(--ink-soft);transition:.15s;white-space:nowrap;}
.news-filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.news-filter-chip:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* ===== 复盘模块 ===== */
  .review-daily .done-head{display:flex;align-items:center;gap:8px;margin:16px 0 2px;}
  .review-daily .done-head .ttl{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.3px;}
  .review-daily .done-head .sub{margin-left:auto;color:var(--ink-soft);font-size:11.5px;font-weight:400;}
  .done-list{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow:auto;padding:4px 2px;margin-top:4px;}
  .done-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);transition:.15s;}
  .done-row:hover{border-color:var(--accent-soft);box-shadow:0 2px 8px rgba(47,79,62,.08);}
  .done-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.16);}
  .done-dot.synced{background:var(--accent-soft);box-shadow:0 0 0 3px rgba(107,143,113,.18);}
  .done-text{flex:1;font-size:14px;color:var(--ink);outline:none;border-radius:7px;padding:3px 5px;min-height:21px;cursor:text;transition:.12s;}
  .done-text[contenteditable="true"]:hover{background:var(--surface);}
  .done-text[contenteditable="true"]:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft) inset;cursor:text;}
  .done-tag{flex:none;font-size:10.5px;padding:2px 9px;border-radius:20px;background:var(--gold);color:#3a2e00;font-weight:600;white-space:nowrap;}
  .done-x{flex:none;width:24px;height:24px;border:none;background:none;border-radius:7px;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;opacity:.45;transition:.15s;}
  .done-x:hover{opacity:1;background:var(--line);color:var(--red);}
  .done-add{display:flex;align-items:center;gap:9px;margin-top:9px;}
  .done-add .plus{flex:none;width:31px;height:31px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;border:none;padding:0;font-family:inherit;cursor:pointer;box-shadow:var(--shadow);transition:background .15s;}
  .done-add .plus:hover{background:var(--accent-soft);}
  .done-add input{flex:1;border-style:dashed;}
  .done-add input:focus{border-style:solid;}
  .review-panel{border:1px dashed var(--line);border-radius:14px;padding:12px 13px;margin-top:15px;background:var(--surface-2);}
  .review-panel .pt{font-size:11.5px;color:var(--accent-soft);font-weight:700;letter-spacing:.5px;margin-bottom:2px;}
  .grid.review-grid{grid-template-columns:1fr 1fr;}
  @media(max-width:880px){.grid.review-grid{grid-template-columns:1fr;}}
  /* 月复盘月份切换 */
  .year-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;}
  .year-label{font-size:15px;font-weight:800;color:var(--accent);min-width:54px;text-align:center;letter-spacing:.5px;}
  /* 月复盘：当月日历热力 */
  .cal-wrap{margin:4px 0 2px;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
  .cal-dow span{text-align:center;font-size:10.5px;color:var(--ink-soft);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:11px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);}
  .cal-cell span{opacity:.85;}
  .cal-empty{background:transparent;border:none;}
  .cal-l0{background:var(--surface-2);color:var(--ink-soft);}
  .cal-l1{background:color-mix(in srgb, var(--accent) 20%, var(--surface));}
  .cal-l2{background:color-mix(in srgb, var(--accent) 42%, var(--surface));}
  .cal-l3{background:color-mix(in srgb, var(--accent) 66%, var(--surface));}
  .cal-l4{background:color-mix(in srgb, var(--accent) 88%, var(--surface));color:#fff;}
  .cal-today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
  .cal-future{opacity:.38;}
  /* 周复盘：本周日历热力（7 格，日期 + 星期） */
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:4px 0 2px;}
  .cal-week .cal-cell{flex-direction:column;gap:2px;aspect-ratio:auto;min-height:56px;font-size:11px;font-weight:600;}
  .cal-week .cal-dnum{font-size:15px;font-weight:800;line-height:1;}
  .cal-week .cal-dow2{font-size:10px;opacity:.7;font-weight:500;}
  .wk-money{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--ink-soft);}
  .wk-money b{color:var(--ink);font-weight:800;}
  /* 月统计条 */
  .m-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px;}
  .m-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;}
  .m-stat .n{font-size:18px;font-weight:800;color:var(--accent);line-height:1.1;}
  .m-stat .t{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  @media(max-width:520px){.m-stats{grid-template-columns:repeat(2,1fr);}}
  /* 复盘历史列表 */
  .hist-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:8px;transition:.15s;}
  .hist-row:hover{border-color:var(--accent-soft);}
  .hist-main{flex:1;min-width:0;}
  .hist-date{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .hist-sum{font-size:12px;color:var(--ink-soft);line-height:1.5;word-break:break-word;}
  .hist-note{color:var(--gold);}
  /* 复盘历史：按年月分组折叠 */
  .hist-group{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface-2);overflow:hidden;}
  .hist-group-sum{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;list-style:none;font-weight:700;color:var(--ink);}
  .hist-group-sum::-webkit-details-marker{display:none;}
  .hist-group-sum:hover{background:var(--accent-soft);}
  .hist-group-label{font-size:13px;letter-spacing:.3px;}
  .hist-group-cnt{margin-left:auto;font-size:11px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-weight:600;}
  .hist-group-sum::before{content:'▸';display:inline-block;transition:.18s;color:var(--accent);font-size:11px;}
  .hist-group[open] .hist-group-sum::before{transform:rotate(90deg);}
  .hist-group > .hist-row{border:none;border-top:1px solid var(--line);border-radius:0;margin-bottom:0;background:transparent;}
  .hist-group > .hist-row:first-of-type{border-top:none;}
  .hist-x{flex:none;width:24px;height:24px;border:none;border-radius:7px;background:transparent;color:var(--ink-soft);font-size:16px;line-height:1;cursor:pointer;transition:.15s;}
  .hist-x:hover{background:var(--red-soft);color:var(--red);}
/* ===== 阅读 · 分类标签栏 ===== */
.rd-genre-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.rd-genre-bar::-webkit-scrollbar{display:none;}
.rd-genre-tag{padding:4px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;cursor:pointer;color:var(--ink-soft);transition:.15s;white-space:nowrap;flex-shrink:0;}
.rd-genre-tag.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.rd-genre-tag:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* ===== 森林雾主题 · 全局重设计 (v2) ===== */
/* 左侧导航栏：深绿渐变 + 底部迷雾森林 */
.sidebar{
  background:
    linear-gradient(180deg,
      rgba(10,24,16,.94) 0%,
      rgba(15,42,29,.86) 22%,
      rgba(18,48,33,.68) 48%,
      rgba(22,56,38,.42) 74%,
      rgba(26,62,42,.18) 100%),
    url('data/forest-hero.jpg') center bottom/cover no-repeat;
  border-right:1px solid rgba(255,250,235,.10)!important;
  box-shadow:2px 0 24px rgba(15,42,29,.18);
  color:rgba(232,240,228,.90);
}
.brand{
  padding:8px 8px 16px;
  border-bottom:1px solid rgba(232,240,228,.10);
  margin-bottom:8px;
}
.brand b{
  color:rgba(240,246,236,.96);
  letter-spacing:2.5px;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
}
.brand img{
  box-shadow:0 3px 12px rgba(0,0,0,.35), 0 0 0 1px rgba(255,250,235,.18) inset;
}
.side-toggle{
  background:rgba(255,250,235,.10);
  border:1px solid rgba(255,250,235,.18);
  color:rgba(244,248,242,.92);
}
.side-toggle:hover{
  background:rgba(201,169,110,.32);
  border-color:rgba(201,169,110,.5);
  color:#fff;
}
.nav-item{
  border-radius:11px; padding:9px 12px;
  font-weight:500; letter-spacing:.3px;
  color:rgba(244,248,242,.94);
  border:1px solid transparent;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.nav-item:hover{
  background:rgba(232,240,228,.10);
  color:#fff;
  border-color:rgba(232,240,228,.14);
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.nav-item.active{
  background:linear-gradient(135deg, color-mix(in srgb, var(--navhl) 30%, transparent), color-mix(in srgb, var(--navhl) 12%, transparent))!important;
  color:#fff;
  border-color:color-mix(in srgb, var(--navhl) 40%, transparent);
  box-shadow:0 4px 14px rgba(0,0,0,.28), 0 0 0 1px rgba(255,250,235,.08) inset;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
}
.nav-item.active::before{ background:var(--navhl)!important; }
.nav-item .badge{
  background:color-mix(in srgb, var(--navhl) 88%, #000);
  color:#20150a;
}
/* 侧边栏底部的个人信息卡 */
.profile-card{
  background:rgba(255,250,235,.08)!important;
  border:1px solid rgba(232,240,228,.14)!important;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.profile-card .p-name{ color:rgba(246,250,244,.98); }
.profile-card .p-name .p-edit{ color:rgba(232,240,228,.78); }
.profile-card .p-row{ color:rgba(238,244,236,.88); }
.profile-card .p-row .p-label{ color:rgba(212,182,120,.98); }
.profile-card .p-motto{ color:rgba(232,240,228,.78); border-left-color:rgba(201,169,110,.8); }
.side-foot{ color:rgba(232,240,228,.78); }
.nav-group-label{ color:rgba(232,240,228,.72); }

.topbar{
  background:rgba(255,253,247,.65);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  border-bottom:1px solid color-mix(in srgb, var(--accent-dark) 10%, transparent);
}
.icon-btn{
  background:rgba(255,253,247,.6);
  border:1px solid color-mix(in srgb, var(--accent-dark) 8%, transparent);
  transition:.22s;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  transform:translateY(-1px);
  box-shadow:0 4px 12px color-mix(in srgb, var(--accent-dark) 25%, transparent);
}

.card{
  background:linear-gradient(180deg, rgba(255,253,247,.62), rgba(249,246,237,.66))!important;
  backdrop-filter:blur(16px) saturate(1.18);
  -webkit-backdrop-filter:blur(16px) saturate(1.18);
  border:1px solid rgba(255,255,255,.60)!important;
  border-radius:20px!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.42), 0 4px 18px color-mix(in srgb, var(--accent-dark) 8%, transparent)!important;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent-dark) 20%, transparent), transparent);
  pointer-events:none;
}
.card:hover{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 8px 28px color-mix(in srgb, var(--accent-dark) 12%, transparent)!important;
  transform:translateY(-1px);
  transition:.25s ease;
}
.card h3{
  font-weight:700; letter-spacing:.3px;
  color:var(--accent-deep);
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.card h3 .sub{
  font-weight:400; color:var(--ink-soft); font-size:12px;
  background:rgba(255,255,255,.55);
  padding:1px 8px;
  border-radius:8px;
  border:1px solid color-mix(in srgb, var(--accent-dark) 8%, transparent);
}
.btn, button.btn{
  background:linear-gradient(180deg, var(--accent), var(--accent-deep));
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:600;
  letter-spacing:.3px;
  padding:8px 16px;
  cursor:pointer;
  box-shadow:0 2px 8px color-mix(in srgb, var(--accent-dark) 30%, transparent), 0 1px 0 rgba(255,255,255,.18) inset;
  transition:.2s cubic-bezier(.22,.61,.36,1);
}
.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px color-mix(in srgb, var(--accent-dark) 42%, transparent), 0 1px 0 rgba(255,255,255,.22) inset;
}
.btn:active{ transform:translateY(0); }
.btn.sm{ padding:5px 12px; font-size:12.5px; border-radius:8px; }
.btn.ghost{
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent);
  box-shadow:none;
}
.btn.ghost:hover{
  background:var(--accent);
  color:#fff;
  box-shadow:0 4px 14px color-mix(in srgb, var(--accent-dark) 30%, transparent);
}

input, select, textarea{
  background:rgba(255,253,247,.85);
  border:1.5px solid color-mix(in srgb, var(--accent-dark) 18%, transparent);
  border-radius:9px;
  padding:7px 11px;
  font-family:inherit;
  font-size:13.5px;
  color:var(--ink);
  transition:.18s;
}
input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent-dark) 10%, transparent);
  background:#fff;
}

.tag{
  font-weight:500;
  letter-spacing:.2px;
  border:1px solid transparent;
}
.tag.green{ background:rgba(45,138,85,.13); color:var(--green); }
.tag.gold{ background:rgba(201,169,110,.20); color:#8a6d2a; }
.tag.red{ background:rgba(179,86,84,.13); color:var(--red); }
.tag.blue{ background:rgba(47,90,110,.14); color:#2f5a78; }

/* 课程表 · 森林风 */
.course-grid{
  border-collapse:separate;
  border-spacing:0;
  background:var(--surface);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  width:100%;
}
.course-cell{
  background:var(--surface);
  border:1px solid var(--line);
  padding:6px 5px;
  min-height:48px;
  position:relative;
  cursor:pointer;
  transition:.15s;
}
.course-cell:hover{
  background:rgba(155,191,134,.18);
  box-shadow:inset 0 0 0 2px var(--accent-soft);
}
.course-cell.has-cat{
  box-shadow:inset 3px 0 0 0 var(--cat-color, var(--accent));
}
.course-cell .cat-dot{
  display:inline-block;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--cat-color, var(--accent));
  margin-right:4px;
  vertical-align:middle;
  box-shadow:0 0 0 2px rgba(255,255,255,.5);
}
.course-cell .title{
  font-weight:600; font-size:12.5px; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
  line-height:1.25;
}
.course-cell .meta{
  font-size:10.5px; color:var(--ink-soft); margin-top:1px;
  display:block;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.course-cell.today-col{ background:linear-gradient(180deg, rgba(201,169,110,.18), rgba(201,169,110,.05)); }
.cat-chip{
  border:1.5px solid var(--cat-color, var(--accent));
  color:var(--cat-color, var(--accent));
  background:transparent;
  padding:3px 11px;
  font-weight:500;
}

/* Hero · 森林雾气横幅 */
.hero-banner{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  isolation:isolate;
  background-color:#1a3a2f;
  background-image:url('data/forest-hero.jpg');
  background-size:cover;
  background-position:center 30%;
  min-height:200px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:22px 26px;
  color:#f4f0ea;
  box-shadow:0 12px 40px rgba(15,42,29,.20), 0 1px 0 rgba(255,255,255,.1) inset;
}
.hero-banner::before{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(6,8,12,0) 55%, rgba(4,6,9,.42) 100%);
  pointer-events:none;
}
.hero-banner > *{ position:relative; z-index:2; }
#heroBanner #heroTime{color:#fff;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.72), 0 0 28px rgba(0,0,0,.38);}
#heroBanner #heroDate,#heroBanner #heroGreet{color:#f4f8f4;text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 14px rgba(0,0,0,.35);}
.hero-banner .hero-time{
  font-size:54px;
  font-weight:300;
  font-variant-numeric:tabular-nums;
  letter-spacing:4px;
  line-height:1;
  color:rgba(248,243,230,.97);
  text-shadow:0 4px 18px rgba(0,0,0,.45);
  font-family: 'PingFang SC','Hiragino Sans GB',-apple-system,BlinkMacSystemFont,sans-serif;
}
.hero-banner .hero-date{
  font-size:13.5px;
  color:rgba(232,240,228,.85);
  margin-top:6px;
  letter-spacing:1.2px;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}
.hero-banner .hero-greet{
  font-size:13.5px;
  color:rgba(201,169,110,.9);
  margin-top:4px;
  letter-spacing:.5px;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}
.hero-banner .hero-weather{
  position:absolute;
  top:18px; right:22px;
  padding:8px 14px;
  border-radius:24px;
  background:color-mix(in srgb, var(--accent-dark) 45%, transparent);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:12.5px;
  color:rgba(248,243,230,.95);
  border:1px solid rgba(255,250,235,.18);
  letter-spacing:.3px;
  z-index:3;
}

/* Modal · 柔光 */
.modal-root{
  background:color-mix(in srgb, var(--accent-dark) 55%, transparent);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.modal{
  background:linear-gradient(180deg, #fefcf6, #f6f1e6);
  border-radius:20px;
  border:1px solid color-mix(in srgb, var(--accent-dark) 18%, transparent);
  box-shadow:0 24px 64px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.7) inset;
  animation: modalIn .25s cubic-bezier(.22,.61,.36,1);
}
@keyframes modalIn{
  from{ opacity:0; transform:translateY(8px) scale(.97); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

/* 进度/数据条 · 森林渐变 */
.xp-bar i, .progress i{
  background:linear-gradient(90deg, var(--accent-deep), var(--accent), var(--accent-soft))!important;
  border-radius:6px;
}

/* 详情条/小数据点 */
.tl-item:before{
  background:linear-gradient(135deg, var(--accent-deep), var(--accent))!important;
  box-shadow:0 0 0 3px rgba(155,191,134,.25);
}

@media(min-width:769px){#nav .nav-item[data-view="apps"]{display:none;}}
@media(min-width:769px){#detail .ov-profile-strip{display:none;}}
/* toast */
.toast:not(.gold):not(.warn){
  background:linear-gradient(135deg, var(--accent-deep), var(--accent));
  box-shadow:0 8px 24px color-mix(in srgb, var(--accent-dark) 30%, transparent);
}

/* 滚动条 · 森林色 */
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:rgba(232,240,228,.4); }
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg, var(--accent-soft), var(--accent));
  border-radius:9px;
  border:1.5px solid var(--surface);
}
::-webkit-scrollbar-thumb:hover{ background:var(--accent-deep); }

/* 呼吸光斑 — 给主要 action 按钮 */
@keyframes breathe{
  0%,100%{ box-shadow:0 4px 14px color-mix(in srgb, var(--accent-dark) 30%, transparent), 0 0 0 0 color-mix(in srgb, var(--accent-dark) 30%, transparent); }
  50%{ box-shadow:0 6px 18px color-mix(in srgb, var(--accent-dark) 40%, transparent), 0 0 0 6px color-mix(in srgb, var(--accent-dark) 8%, transparent); }
}
.btn.primary.live{ animation: breathe 2.6s ease-in-out infinite; }

/* 详情卡 — 课程今日卡 */
.today-course .title{ font-weight:600; color:var(--accent-deep); }
.today-course .when{ color:var(--gold); font-weight:600; }

/* ===== 深色主题适配（月光森林） ===== */
[data-theme="dark"] body::before{
  opacity:.30;
  filter:blur(22px) saturate(.85) brightness(.55);
}
[data-theme="dark"] body::after{
  background:
    radial-gradient(ellipse 70% 30% at 50% -6%, rgba(20,36,26,.5), transparent 70%),
    linear-gradient(180deg, rgba(13,22,18,.90) 0%, rgba(16,27,21,.86) 45%, rgba(11,20,15,.92) 100%);
}
[data-theme="dark"] .sidebar{
  background:
    linear-gradient(180deg,
      rgba(5,12,8,.97) 0%,
      rgba(8,20,13,.93) 30%,
      rgba(10,28,18,.80) 70%,
      rgba(12,34,22,.55) 100%),
    url('data/forest-hero.jpg') center bottom/cover no-repeat;
}
[data-theme="dark"] .topbar{
  background:rgba(18,28,22,.62);
  border-bottom:1px solid color-mix(in srgb, var(--accent) 14%, transparent);
}
[data-theme="dark"] .card{
  background:linear-gradient(180deg, rgba(30,44,36,.58), rgba(25,39,31,.62))!important;
  border:1px solid color-mix(in srgb, var(--accent) 15%, transparent)!important;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 7%, transparent), 0 4px 18px rgba(0,0,0,.32)!important;
}
[data-theme="dark"] .card::before{
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 22%, transparent), transparent);
}
[data-theme="dark"] .card:hover{
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent), 0 8px 28px rgba(0,0,0,.42)!important;
}
[data-theme="dark"] .card h3{ color:var(--accent-soft); text-shadow:none; }
[data-theme="dark"] .card h3 .sub{
  background:color-mix(in srgb, var(--accent) 10%, transparent);
  border-color:color-mix(in srgb, var(--accent) 12%, transparent);
  color:var(--ink-soft);
}
[data-theme="dark"] .icon-btn{
  background:rgba(21,32,26,.6);
  border-color:color-mix(in srgb, var(--accent) 14%, transparent);
  color:var(--ink);
}
[data-theme="dark"] .modal{
  background:linear-gradient(180deg, #1c2a21, #16221a);
  border:1px solid color-mix(in srgb, var(--accent) 18%, transparent);
}
[data-theme="dark"] input,
[data-theme="dark"] select,
[data-theme="dark"] textarea{
  background:rgba(21,32,26,.7);
  border-color:color-mix(in srgb, var(--accent) 18%, transparent);
  color:var(--ink);
}
[data-theme="dark"] input:focus,
[data-theme="dark"] select:focus,
[data-theme="dark"] textarea:focus{
  background:rgba(26,40,32,.85);
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}
[data-theme="dark"] .today-course .title{ color:var(--accent-soft); }
[data-theme="dark"] .course-cell{ background:rgba(21,32,26,.5); border-color:color-mix(in srgb, var(--accent) 12%, transparent); }
[data-theme="dark"] .course-cell:hover{ background:color-mix(in srgb, var(--accent) 12%, transparent); }
[data-theme="dark"] .course-grid{ background:transparent; border-color:color-mix(in srgb, var(--accent) 14%, transparent); }
/* ===== 对话助手（智能助手）===== */
.ai-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px);min-height:420px;}

/* Hero */
.ai-hero{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;margin-bottom:10px;border-radius:13px;
  background:linear-gradient(115deg, color-mix(in srgb, var(--accent-dark) 14%, transparent), rgba(201,169,110,.15));
  border:1px solid var(--line);overflow:hidden;}
.ai-hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(93,132,112,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(93,132,112,.18) 1px,transparent 1px);
  background-size:20px 20px;
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.75),transparent 60%);mask-image:linear-gradient(90deg,rgba(0,0,0,.75),transparent 60%);}
.ai-hero::after{content:"";position:absolute;top:0;left:-32%;width:32%;height:100%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,.22),transparent);animation:aiScan 6s linear infinite;}
@keyframes aiScan{0%{left:-32%;}55%,100%{left:112%;}}
.ai-hero-ava{position:relative;width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));box-shadow:0 4px 12px color-mix(in srgb, var(--accent-dark) 30%, transparent);z-index:1;}
.ai-hero-ava::after{content:"";position:absolute;inset:-3px;border-radius:14px;border:1px solid rgba(201,169,110,.6);animation:aiRing 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes aiRing{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:.9;transform:scale(1.07);}}
.ai-hero-ava svg{width:19px;height:19px;color:#fbf8f1;}
.ai-hero-meta{flex:1;min-width:0;z-index:1;}
.ai-hero-name{font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:.2px;display:flex;align-items:center;gap:6px;}
.ai-badge{font-size:9px;font-weight:800;letter-spacing:.7px;padding:2px 5px;border-radius:5px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.ai-hero-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.ai-status{display:inline-flex;align-items:center;gap:4px;color:var(--accent-soft);font-weight:600;}
.ai-status i{width:6px;height:6px;border-radius:50%;background:#5dbe7a;box-shadow:0 0 0 3px rgba(93,190,122,.18);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ai-hero-actions{display:flex;align-items:center;gap:6px;flex:none;z-index:1;}
.ai-hero-actions .btn.ghost.sm{padding:4px 9px;font-size:12px;}
.ai-toggle{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;white-space:nowrap;}
.ai-toggle input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer;}

/* Banner */
.ai-banner{background:rgba(201,169,110,.14);border:1px solid rgba(201,169,110,.4);color:#7a5a1e;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;}
[data-theme="dark"] .ai-banner{color:#e6cf9a;}

/* Messages */
.ai-msgs{flex:1;overflow-y:auto;padding:4px 4px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;}
.ai-msg{display:flex;align-items:flex-end;gap:8px;}
.ai-msg.user{justify-content:flex-end;}
.ai-msg.bot,.ai-msg.tool{justify-content:flex-start;}
.ai-ava{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;box-shadow:0 3px 8px color-mix(in srgb, var(--accent-dark) 25%, transparent);}
.ai-ava.tool{background:linear-gradient(135deg,var(--gold),#b3894e);font-weight:700;}
.ai-ava svg{width:17px;height:17px;}
.ai-msg .bubble{max-width:76%;padding:11px 14px;border-radius:16px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 10px rgba(20,40,30,.05);}
.ai-msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-bottom-right-radius:5px;}
.ai-msg.bot .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;}
.ai-msg.tool .bubble{background:color-mix(in srgb, var(--accent) 12%, transparent);border:1px dashed var(--line);color:var(--ink-soft);font-size:12.5px;max-width:82%;}
[data-theme="dark"] .ai-msg.bot .bubble{background:var(--surface-2);}

/* Empty state */
.ai-empty{margin:auto;text-align:center;padding:24px 10px;}
.ai-empty-tt{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
.ai-chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:540px;margin:0 auto;}
.ai-chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s;}
.ai-chip:hover{border-color:var(--accent-soft);background:color-mix(in srgb, var(--accent-dark) 6%, transparent);transform:translateY(-1px);}
[data-theme="dark"] .ai-chip{background:var(--surface-2);}

/* Thinking */
.ai-thinking{padding:6px 8px;color:var(--ink-soft);font-size:13px;display:flex;align-items:center;gap:8px;}
.ai-thinking .dot{width:7px;height:7px;border-radius:50%;background:var(--accent-soft);animation:ai-bounce 1.2s infinite;}
.ai-thinking .dot:nth-child(2){animation-delay:.2s;}
.ai-thinking .dot:nth-child(3){animation-delay:.4s;}
@keyframes ai-bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* Input */
.ai-input{display:flex;gap:10px;align-items:flex-end;margin-top:12px;border-top:1px solid var(--line);padding-top:14px;}
.ai-input textarea{flex:1;max-height:200px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:11px 14px;font-size:14px;}
.ai-input textarea:focus{border-color:var(--accent-soft);box-shadow:0 0 0 3px rgba(93,132,112,.15);}
.ai-send{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;box-shadow:0 5px 14px color-mix(in srgb, var(--accent-dark) 30%, transparent);transition:.15s;}
.ai-send svg{width:18px;height:18px;}
.ai-send:hover{transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb, var(--accent-dark) 42%, transparent);}
.ai-send:disabled{opacity:.5;cursor:not-allowed;transform:none;}
[data-theme="dark"] .ai-hero-ava,[data-theme="dark"] .ai-ava{background:linear-gradient(135deg,#2d5a3d,#1a3a2f);}
[data-theme="dark"] .ai-send{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#0d1612;}
.ai-ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:.15s;}
.ai-ico svg{width:18px;height:18px;}
.ai-ico:hover{color:var(--accent);border-color:var(--accent-soft);background:color-mix(in srgb, var(--accent-dark) 7%, transparent);transform:translateY(-1px);}
.ai-mic.rec{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;animation:micPulse 1.2s ease-in-out infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(93,132,112,.45);}50%{box-shadow:0 0 0 8px rgba(93,132,112,0);}}
.ai-voice{display:none;align-items:center;gap:8px;margin-top:8px;color:var(--accent);font-size:12.5px;}
.ai-voice i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:micBlink .8s infinite;}
@keyframes micBlink{0%,100%{opacity:.25;}50%{opacity:1;}}
[data-theme="dark"] .ai-ico{background:rgba(255,255,255,.06);}
.ai-attach{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.ai-attach:empty{display:none;}
.ai-att{position:relative;display:flex;align-items:center;gap:7px;max-width:210px;padding:5px 26px 5px 7px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--ink-soft);}
.ai-att img{width:34px;height:34px;border-radius:7px;object-fit:cover;flex:none;border:1px solid var(--line);}
.ai-att-ico{width:34px;height:34px;border-radius:7px;flex:none;display:grid;place-items:center;background:rgba(201,169,110,.18);color:#8a6a24;font-size:14px;}
.ai-att-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ai-att-x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-soft);cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;transition:.15s;}
.ai-att-x:hover{background:var(--accent);color:#fff;}
.ai-attlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;justify-content:flex-end;}
.ai-attlist img{max-width:160px;max-height:160px;border-radius:9px;border:1px solid rgba(255,255,255,.3);}
.ai-att-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.2);font-size:11px;color:#fff;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 会话记录栏 */
.ai-body{flex:1;display:flex;gap:12px;min-height:0;}
.ai-side{width:188px;flex:none;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;}
.ai-side-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(115deg,color-mix(in srgb, var(--accent-dark) 9%, transparent),rgba(201,169,110,.11));}
.ai-side-head b{font-size:12px;letter-spacing:.5px;color:var(--ink);}
.ai-newbtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;cursor:pointer;transition:.15s;}
.ai-newbtn:hover{background:var(--accent);color:#fff;border-color:transparent;}
.ai-sess-list{flex:1;overflow-y:auto;padding:6px;}
.ai-sess{position:relative;padding:8px 24px 7px 9px;border-radius:9px;cursor:pointer;margin-bottom:2px;transition:background .14s;border:1px solid transparent;}
.ai-sess:hover{background:color-mix(in srgb, var(--accent-dark) 7%, transparent);}
.ai-sess.on{background:linear-gradient(115deg,color-mix(in srgb, var(--accent-dark) 15%, transparent),rgba(201,169,110,.13));border-color:color-mix(in srgb, var(--accent-dark) 22%, transparent);}
.ai-sess-t{font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ai-sess-m{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.ai-sess-x{position:absolute;top:5px;right:5px;width:17px;height:17px;border-radius:50%;border:none;background:transparent;color:var(--ink-soft);
  cursor:pointer;font-size:12px;line-height:1;padding:0;display:none;place-items:center;}
.ai-sess:hover .ai-sess-x{display:grid;}
.ai-sess-x:hover{background:var(--accent);color:#fff;}
.ai-sess-empty{color:var(--ink-soft);font-size:11.5px;text-align:center;padding:26px 8px;line-height:1.7;}
.ai-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
[data-theme="dark"] .ai-side{background:var(--surface-2);}
[data-theme="dark"] .ai-newbtn{background:rgba(255,255,255,.07);color:#bfe3cc;}
[data-theme="dark"] .ai-sess:hover{background:rgba(255,255,255,.05);}
[data-theme="dark"] .ai-sess.on{border-color:color-mix(in srgb, var(--accent) 40%, transparent);}
/* ============================================================
   背景场景体系（A.主题色×氛围背景  +  C.模式开关/自定义图）
   data-bg: theme(默认,随主题色) | off(纯色) | custom(自定义图)
   墨绿 theme = 月光森林实景(原设计)；黛蓝/赭石/紫棠 = 同色系氛围
   ============================================================ */
/* —— A. theme 非墨绿色系：全局底色氛围（同色系氛围图 + 光晕） —— */
[data-bg="theme"][data-color="blue"] body::before{
  background:
    radial-gradient(120% 95% at 50% -12%, color-mix(in srgb, var(--accent-soft) 26%, transparent), transparent 55%),
    url('data/bg-blue.png') center 40%/cover no-repeat;
}
[data-bg="theme"][data-color="ochre"] body::before{
  background:
    radial-gradient(120% 95% at 50% -12%, color-mix(in srgb, var(--accent-soft) 26%, transparent), transparent 55%),
    url('data/bg-ochre.png') center 40%/cover no-repeat;
}
[data-bg="theme"][data-color="violet"] body::before{
  background:
    radial-gradient(120% 95% at 50% -12%, color-mix(in srgb, var(--accent-soft) 26%, transparent), transparent 55%),
    url('data/bg-violet.png') 75% 28%/cover no-repeat;
}
/* —— A. dark 下非绿 theme 的遮罩稍透，露出同色氛围 —— */
[data-theme="dark"][data-bg="theme"]:is([data-color="blue"],[data-color="ochre"],[data-color="violet"]) body::after{
  background:
    radial-gradient(ellipse 70% 30% at 50% -6%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, var(--paper) 66%, #04060a) 0%, color-mix(in srgb, var(--paper) 60%, #06090c) 45%, color-mix(in srgb, var(--paper) 72%, #04050a) 100%);
}
/* —— A. 非墨绿 theme：侧栏 = 主题色五层渐变(仿月光森林原结构) + 同主题氛围图叠底 —— */
[data-bg="theme"][data-color="blue"] .sidebar{
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--accent-dark) 94%, transparent) 0%,
      color-mix(in srgb, var(--accent-dark) 82%, transparent) 22%,
      color-mix(in srgb, var(--accent-dark) 60%, transparent) 48%,
      color-mix(in srgb, var(--accent-dark) 36%, transparent) 74%,
      color-mix(in srgb, var(--accent-dark) 12%, transparent) 100%),
    url('data/bg-blue.png') center bottom/cover no-repeat;
  border-right:1px solid rgba(255,255,255,.08)!important;
  box-shadow:2px 0 24px color-mix(in srgb, var(--accent-dark) 24%, transparent);
}
[data-bg="theme"][data-color="ochre"] .sidebar{
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--accent-dark) 94%, transparent) 0%,
      color-mix(in srgb, var(--accent-dark) 82%, transparent) 22%,
      color-mix(in srgb, var(--accent-dark) 60%, transparent) 48%,
      color-mix(in srgb, var(--accent-dark) 36%, transparent) 74%,
      color-mix(in srgb, var(--accent-dark) 12%, transparent) 100%),
    url('data/bg-ochre.png') center bottom/cover no-repeat;
  border-right:1px solid rgba(255,255,255,.08)!important;
  box-shadow:2px 0 24px color-mix(in srgb, var(--accent-dark) 24%, transparent);
}
[data-bg="theme"][data-color="violet"] .sidebar{
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--accent-dark) 94%, transparent) 0%,
      color-mix(in srgb, var(--accent-dark) 82%, transparent) 22%,
      color-mix(in srgb, var(--accent-dark) 60%, transparent) 48%,
      color-mix(in srgb, var(--accent-dark) 36%, transparent) 74%,
      color-mix(in srgb, var(--accent-dark) 12%, transparent) 100%),
    url('data/bg-violet.png') 75% 28%/cover no-repeat;
  border-right:1px solid rgba(255,255,255,.08)!important;
  box-shadow:2px 0 24px color-mix(in srgb, var(--accent-dark) 24%, transparent);
}
[data-bg="theme"][data-color="blue"] .hero-banner{
  background-image:url('data/bg-blue.png');
  background-color:color-mix(in srgb, var(--accent-deep) 64%, #0a0d0f);
  box-shadow:0 12px 40px color-mix(in srgb, var(--accent-dark) 22%, transparent), 0 1px 0 rgba(255,255,255,.1) inset;
}
[data-bg="theme"][data-color="ochre"] .hero-banner{
  background-image:url('data/bg-ochre.png');
  background-color:color-mix(in srgb, var(--accent-deep) 64%, #0a0d0f);
  box-shadow:0 12px 40px color-mix(in srgb, var(--accent-dark) 22%, transparent), 0 1px 0 rgba(255,255,255,.1) inset;
}
[data-bg="theme"][data-color="violet"] .hero-banner{
  background-image:url('data/bg-violet.png');
  background-position:75% 28%; background-size:cover; background-repeat:no-repeat;
  background-color:color-mix(in srgb, var(--accent-deep) 64%, #0a0d0f);
  box-shadow:0 12px 40px color-mix(in srgb, var(--accent-dark) 22%, transparent), 0 1px 0 rgba(255,255,255,.1) inset;
}
/* —— C. 纯色（无氛围背景） —— */
[data-bg="off"] body::before,
[data-bg="off"] body::after{ display:none; }
[data-bg="off"] .sidebar{
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--navhl) 12%, #0a0d0f) 0%,
      color-mix(in srgb, var(--navhl) 4%, #0c0f11) 55%,
      #0d1012 100%);
  border-right:1px solid rgba(255,255,255,.08)!important;
}
[data-bg="off"] .hero-banner{
  background-image:none;
  background-color:color-mix(in srgb, var(--accent-deep) 55%, #0b0e10);
}
/* —— C. 自定义背景图（JS 注入 --bg-custom；可开柔化 class） —— */
[data-bg="custom"] body::before{
  background:var(--bg-custom, url('data/forest-hero.jpg')) center/cover no-repeat;
  filter:blur(0) saturate(1.05);
  opacity:.55;
}
[data-bg="custom"] body.bgsoft::before{
  filter:blur(16px) brightness(.92) saturate(1.05);
}
[data-bg="custom"] body::after{ background:transparent; }
[data-bg="custom"] .sidebar{
  background:linear-gradient(180deg, rgba(7,9,11,.92) 0%, rgba(9,12,14,.78) 60%, rgba(11,13,15,.66) 100%);
  border-right:1px solid rgba(255,255,255,.08)!important;
}
[data-bg="custom"] .hero-banner{
  background-color:#101416;
  background-image:var(--bg-custom, url('data/forest-hero.jpg'));
}
/* ===== 文献精读（对齐飞书「文献记录表」） ===== */
.lit-fbar{display:flex;align-items:flex-start;gap:8px;margin-bottom:2px}
.lit-flab{flex:0 0 30px;font-size:11px;color:var(--ink-soft);padding-top:6px;letter-spacing:.5px}
.lit-card{border-top:1px solid var(--line)}
.lit-card:first-of-type{border-top:0}
.lit-card.open{background:color-mix(in srgb, var(--surface-2) 45%, transparent);border-radius:12px;padding:0 8px;margin:4px 0}
.lit-detail{padding:2px 2px 12px}
.lit-dims{display:grid;grid-template-columns:1fr;gap:9px}
.lit-dim{border-left:2px solid var(--accent-soft);padding:3px 0 3px 9px}
.lit-dim-h{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.4px;margin-bottom:2px;display:flex;gap:6px;align-items:center}
.lit-dim-tag{font-weight:400;color:var(--ink-soft);border:1px dashed var(--line);border-radius:6px;padding:0 5px;font-size:10.5px}
.lit-dim-b{font-size:12.5px;line-height:1.68}
.lit-row{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.lit-flab2{flex:0 0 66px;font-size:11.5px;color:var(--ink-soft);padding-top:3px}
.lit-tags,.lit-note{flex:1;min-width:0}
.lit-note{font-size:12.5px;line-height:1.68}
.lit-cite{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.lit-cite code{flex:1;min-width:0;font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-family:inherit}
.lit-copy{flex:0 0 auto;font-size:11px;color:var(--accent);cursor:pointer;font-weight:600}
.lit-cite-line{font-size:12.5px;line-height:1.6}
.lit-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lit-anote{margin-top:8px;font-size:12px;line-height:1.65}
.warn-t{color:var(--warn)}
.lit-dim.empty{border-left-color:var(--line)}
.lit-dim.empty .lit-dim-h{font-weight:400;color:var(--ink-soft)}
.lit-empty-hint{font-size:12px;line-height:1.7;color:var(--ink-soft);background:var(--surface);border:1px dashed var(--line);border-radius:9px;padding:8px 10px;margin-bottom:10px}
@media(min-width:769px){.lit-dims{grid-template-columns:1fr 1fr}}

/* ===== 科研进程内嵌 AI 面板 ===== */
.res-ai-bar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px;cursor:pointer;font-size:12.5px;color:var(--ink-soft)}
.res-ai-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto}
.res-ai-open{margin-left:auto;color:var(--accent);font-weight:600}
.res-ai{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.res-ai-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:8px}
.res-ai-head .sub{font-weight:400;font-size:11px;color:var(--ink-soft)}
.res-ai-x{margin-left:auto;font-size:11px;color:var(--ink-soft);cursor:pointer;font-weight:400}
.res-ai-x+.res-ai-x{margin-left:10px}
.res-ai-log{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.res-ai-msg{font-size:12.5px;line-height:1.68;padding:7px 10px;border-radius:9px;max-width:93%}
.res-ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.res-ai-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.res-ai-hint{font-size:12px;color:var(--ink-soft);line-height:1.9}
.res-ai-in{display:flex;gap:8px;align-items:flex-end}
.res-ai-in textarea{flex:1;min-width:0;font-size:13px;resize:none;max-height:110px}
.res-ai-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* ===== 文献批量导入（拖放弹窗） ===== */
.imp-drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s}
.imp-drop.over{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--surface))}
.imp-ico{font-size:30px;line-height:1.1}
.imp-tt{font-size:14px;font-weight:600;margin-top:6px;color:var(--ink)}
.imp-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.imp-list{margin-top:10px;max-height:230px;overflow:auto}
.imp-item{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}
.imp-item:last-child{border-bottom:0}
.imp-n{flex:none;width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);font-size:10.5px;display:flex;align-items:center;justify-content:center}
.imp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-size{flex:none;color:var(--ink-soft);font-size:11px}
.imp-msg{flex:none;color:var(--ink-soft);font-size:11px;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-item.run .imp-msg{color:var(--accent);font-weight:600}
.imp-item.ok .imp-msg{color:var(--green);font-weight:600}
.imp-item.err .imp-msg{color:var(--red);font-weight:600}
/* ===== 内嵌 PDF 阅读器 ===== */
.pdf-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pdf-stage{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;min-height:180px;max-height:64vh;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
/* ===== 科研页布局优化（2026-09-23 二版） ===== */
/* AI 入口条：细，不占地方 */
.res-ai-bar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:10px;font-size:12.5px;cursor:default}
.res-ai-bar .btn{flex:none}
.res-ai-bt{font-weight:600;color:var(--ink);flex:none}
.res-ai-bn{color:var(--ink-soft);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-ai-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.res-ai-dot.busy{animation:resAiPulse 1s ease-in-out infinite}
@keyframes resAiPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
/* 弹窗内的对话 */
.res-ai-modal-h{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-bottom:8px;flex-wrap:wrap}
.res-ai-x{font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:600}
.res-ai-log{max-height:44vh;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:2px 0}
.res-ai-msg{font-size:13px;line-height:1.75;padding:8px 11px;border-radius:10px;max-width:94%}
.res-ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.res-ai-msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.res-ai-in{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.res-ai-in textarea{flex:1;min-width:0;font-size:13.5px;resize:none;max-height:130px;line-height:1.6}
/* 筛选折叠摘要 */
.lit-fbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.lit-flab{flex:none;font-size:11px;color:var(--ink-soft);letter-spacing:.5px}
.lit-fsum{flex:1;min-width:0;font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px}
